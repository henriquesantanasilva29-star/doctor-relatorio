<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Canais · Grupo Job</title>
<script>/* tema do portal (claro/escuro) */
(function(){ var d = document.documentElement;
  function aplica(){ var t = null; try{ t = localStorage.getItem("rel_tema"); }catch(e){}
    d.setAttribute("data-theme", t === "light" ? "light" : "dark"); }
  aplica();
  window.addEventListener("storage", function(e){ if(!e.key || e.key === "rel_tema") aplica(); });
  window.addEventListener("message", function(e){ if(e.origin === location.origin && e.data && e.data.tipo === "tema") aplica(); });
})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700&family=Saira:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Canais v2 (14/10/2026) — refeito do zero com os tokens do portal (Arasys). */
:root{
  color-scheme:dark;
  --ground:#0A0A0F; --surface:#131319; --surface-2:#1A1A22; --surface-3:#22222C; --line:#24242E; --line-2:#30303C; --grid:#1E1E27;
  --ink:#F5F5F7; --ink-2:#A0A0AC; --ink-3:#7A7A86; --accent:#7C3AED;
  --ok:#6BBF86; --warn:#E0A84A; --bad:#E57373; --warn-bg:#2E2412; --bad-bg:#2E1517;
  --shadow:0 1px 2px rgba(0,0,0,.4); --hover:rgba(255,255,255,.03);
  --g-pago:#2a78d6; --g-naopago:#eb6834; --g-fora:#1baf7a; --g-sem:#eda100;
  --ag-vanguarda:#E5484D; --ag-fsx:#30A46C; --ag-vx:#F5A524; --ag-outra:#7A7A86;
}
:root[data-theme="light"]{
  color-scheme:light;
  --ground:#F5F5F7; --surface:#FFFFFF; --surface-2:#F0EFF5; --surface-3:#E7E5F0; --line:#E2E2E8; --line-2:#CFCFD8; --grid:#ECECF1;
  --ink:#0A0A0F; --ink-2:#4A4A55; --ink-3:#6E6E7A;
  --ok:#2F7D4F; --warn:#B45309; --bad:#C62828; --warn-bg:#FEF3C7; --bad-bg:#FEE2E2;
  --shadow:0 1px 2px rgba(10,10,15,.06); --hover:rgba(10,10,15,.025);
}
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink); font-family:"Saira",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased}
.wrap{max-width:1400px; margin:0 auto; padding:4px 16px 48px}
h2{font-family:"Saira Semi Condensed","Saira",sans-serif; font-size:19px; font-weight:700; margin:0}
button,input{font:inherit}
.num{font-variant-numeric:tabular-nums}
.dim{color:var(--ink-3)}

/* filtros */
.filtros{display:flex; flex-direction:column; gap:8px; padding:6px 0 14px; border-bottom:1px solid var(--line)}
.linha-f{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.linha-f > .rot{font-family:"JetBrains Mono",ui-monospace,monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3); font-weight:500; width:66px; flex:none}
.chip{appearance:none; border:1px solid var(--line-2); background:transparent; cursor:pointer; font-family:"Saira Semi Condensed",sans-serif;
  font-size:12.5px; font-weight:600; color:var(--ink-2); padding:6px 14px; border-radius:999px; display:inline-flex; align-items:center;
  gap:7px; white-space:nowrap; line-height:1.3}
.chip:hover{border-color:var(--ink-3); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--chipc,var(--accent)); border-color:var(--chipc,var(--accent)); color:#fff}
.chip .dot{width:8px; height:8px; border-radius:50%; background:var(--chipc,var(--ink-3)); flex:none}
.chip[aria-pressed="true"] .dot{background:#fff}
.chip .n{font-family:"Saira",sans-serif; font-weight:700; font-size:11.5px; color:var(--ink-3); background:var(--surface-2);
  border-radius:999px; padding:1px 8px; font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] .n{background:rgba(255,255,255,.22); color:#fff}
.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.datas{display:inline-flex; align-items:center; gap:6px; margin-left:4px}
.datas input{background:var(--surface); color:var(--ink); border:1px solid var(--line-2); border-radius:8px; padding:4px 8px; font-size:12.5px}
.frescor{margin-left:auto; font-size:11.5px; color:var(--ink-3); white-space:nowrap}
.aviso{background:var(--warn-bg); color:var(--warn); border-radius:10px; padding:10px 14px; font-size:12.5px; margin-top:12px}
.aviso b{color:var(--ink)}
.carregando{padding:60px 0; text-align:center; color:var(--ink-3)}

/* kpis */
.kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-top:18px}
@media (max-width:900px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px; box-shadow:var(--shadow)}
.kpi .k{font-family:"JetBrains Mono",ui-monospace,monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.kpi .v{font-family:"Saira Semi Condensed",sans-serif; font-size:clamp(20px,2vw,28px); font-weight:700; line-height:1.15; margin-top:6px;
  letter-spacing:-.02em; white-space:nowrap; font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px; color:var(--ink-2); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.kpi.dest{border-top:2px solid var(--chipc,var(--accent))}

/* blocos */
section.sec{margin-top:30px}
.sec-head{display:flex; align-items:baseline; gap:14px; margin-bottom:10px; flex-wrap:wrap}
.sec-head .tot{font-size:13px; color:var(--ink-2)}
.sec-head .tot b{color:var(--ink); font-variant-numeric:tabular-nums}
.sec-head .acoes{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:13px}
thead th{text-align:left; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:10.5px; font-weight:500; letter-spacing:.08em;
  text-transform:uppercase; background:var(--surface-2); color:var(--ink-3); padding:9px 12px; white-space:nowrap; border-bottom:1px solid var(--line)}
thead th[data-ord]{cursor:pointer; user-select:none}
thead th[data-ord]:hover{color:var(--ink)}
thead th.ord::after{content:" ▾"} thead th.ord.asc::after{content:" ▴"}
td{padding:8px 12px; border-bottom:1px solid var(--grid); white-space:nowrap; vertical-align:middle}
tbody tr:hover td{background:var(--hover)}
th.num,td.num{text-align:right; font-variant-numeric:tabular-nums}
tfoot td{font-weight:700; border-top:1px solid var(--line-2); border-bottom:0; background:var(--surface-2)}
td.b{font-weight:700}
.dot{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:8px; vertical-align:0}
tr.ag{cursor:pointer}
tr.ag td:first-child::before{content:"▸"; display:inline-block; width:14px; color:var(--ink-3)}
tr.ag.aberto td:first-child::before{content:"▾"}
tr.conta td{color:var(--ink-2); font-size:12.5px; background:var(--surface-2)}
tr.conta td:first-child{padding-left:40px}
tr.residuo td{color:var(--ink-2); font-style:italic}
.nome{font-weight:600; color:var(--ink)}
.sub{display:block; font-size:11.5px; color:var(--ink-3); max-width:360px; overflow:hidden; text-overflow:ellipsis}
.tag{display:inline-block; font-size:11px; font-weight:600; padding:1px 8px; border-radius:999px; border:1px solid var(--line-2); color:var(--ink-2)}
.tag.ag{border-color:var(--chipc); color:var(--chipc)}
.sit{font-weight:600}
.sit.realizado{color:var(--bad)} .sit.passou{color:var(--warn)} .sit.sem_data{color:var(--warn)} .sit.marcado{color:var(--ok)}
.fora{color:var(--ink-3); font-style:italic}

/* barra do caixa */
.barra{display:flex; height:16px; border-radius:6px; overflow:hidden; gap:2px; margin:14px 16px 10px}
.barra i{display:block; height:100%; min-width:3px}
.leg{display:flex; flex-wrap:wrap; gap:6px 18px; padding:0 16px 14px; font-size:12.5px; color:var(--ink-2)}
.leg b{color:var(--ink); font-variant-numeric:tabular-nums}

.busca{background:var(--surface); color:var(--ink); border:1px solid var(--line-2); border-radius:999px; padding:6px 14px; font-size:12.5px; width:220px}
.btn{appearance:none; border:1px solid var(--line-2); background:transparent; cursor:pointer; font-family:"Saira Semi Condensed",sans-serif;
  font-size:12.5px; font-weight:600; color:var(--ink); padding:6px 14px; border-radius:999px}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.mais{padding:10px 12px; text-align:center}
.vazio{padding:22px; text-align:center; color:var(--ink-3)}
.oculto{display:none !important}

@media (max-width:640px){
  .wrap{padding:4px 12px 40px}
  .linha-f > .rot{width:100%}
  .frescor{margin-left:0; width:100%}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
  .kpi{padding:12px}
  .kpi .v{font-size:20px}
  .busca{width:100%}
  .kpi .d{white-space:normal}
  #tAds td:first-child,#tAb td:first-child,#tPg td:nth-child(2){white-space:normal; min-width:170px; max-width:210px}
  .sub{max-width:200px; white-space:nowrap}
  .sec-head .acoes{margin-left:0; width:100%}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="filtros" id="filtros">
    <div class="linha-f"><span class="rot">Período</span><span id="fPer"></span>
      <span class="datas"><input type="date" id="fDe" aria-label="De"><span class="dim">a</span><input type="date" id="fAte" aria-label="Até"></span>
      <span class="frescor" id="frescor"></span></div>
    <div class="linha-f" id="lMarca"><span class="rot">Marca</span><span id="fMarca"></span></div>
    <div class="linha-f"><span class="rot">Agência</span><span id="fAg"></span></div>
  </div>
  <div id="aviso" class="aviso oculto"></div>
  <div id="carregando" class="carregando">carregando…</div>

  <div id="conteudo" class="oculto">
    <div class="kpis" id="kpis"></div>

    <section class="sec" id="sOrigem">
      <div class="sec-head"><h2>Origem do caixa</h2></div>
      <div class="card">
        <div class="barra" id="barra"></div><div class="leg" id="leg"></div>
        <div class="tbl-wrap"><table id="tCanais"></table></div>
      </div>
    </section>

    <section class="sec" id="sAg">
      <div class="sec-head"><h2>Agências</h2></div>
      <div class="card tbl-wrap"><table id="tAg"></table></div>
    </section>

    <section class="sec" id="sAds">
      <div class="sec-head"><h2>Anúncios</h2><span class="tot" id="adsTot"></span></div>
      <div class="card"><div class="tbl-wrap"><table id="tAds"></table></div><div class="mais" id="adsMais"></div></div>
    </section>

    <section class="sec" id="sAberto">
      <div class="sec-head"><h2>Fechado e não pago</h2><span class="tot" id="abTot"></span>
        <div class="acoes"><input class="busca" id="abBusca" type="search" placeholder="Buscar paciente ou código"></div></div>
      <div class="linha-f" id="abSit" style="margin-bottom:8px"></div>
      <div class="linha-f" id="abOrig" style="margin-bottom:10px"></div>
      <div class="card"><div class="tbl-wrap"><table id="tAb"></table></div><div class="mais" id="abMais"></div></div>
    </section>

    <section class="sec" id="sPagou">
      <div class="sec-head"><h2>Quem pagou</h2><span class="tot" id="pgTot"></span>
        <div class="acoes"><input class="busca" id="pgBusca" type="search" placeholder="Buscar paciente, código ou procedimento"></div></div>
      <div class="linha-f" id="pgOrig" style="margin-bottom:10px"></div>
      <div class="card"><div class="tbl-wrap"><table id="tPg"></table></div><div class="mais" id="pgMais"></div></div>
    </section>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
   CANAIS v2 — 14/10/2026, refeito do zero a pedido do Henrique.
   Só indicadores e os filtros (período, marca, agência). As regras que
   já tinham sido validadas continuam as mesmas, agora em um lugar só:
   · Régua única de origem (mv_atribuicao_unica): o paciente chega no
     primeiro contato; anúncio até 1 dia depois faz dele paciente de anúncio.
   · Caixa = pagamentos do Feegow no período, pela origem do paciente
     (soma de todos os canais = Feegow, no centavo).
   · Coorte (leads, pacientes, faturado, recebido, em aberto) = de quem
     chegou no período.
   · Agência pela VIGÊNCIA da conta no dia (meta_agencia_periodo na Doctor;
     na Acesso, a tabela CONTAS_ACESSO abaixo, igual à agencia_da_conta).
   · Odonto (0085 Doctor, 0279 Acesso) agenda e cobra fora do Feegow: fica
     fora do retorno e do custo por paciente.
   · Reativação (quem já conhecia a clínica e comprou depois do clique)
     fica à parte, nunca somada ao faturado da agência.
   Fontes: painel-canais de cada base — action "dados" (blocos do dados.json
   publicado às 05:30), "aberto" e "rastro" (lidos na hora, até 93 dias).
   ===================================================================== */
var PORTAL = 'https://relatorio.arasys.software/';
var FN = { doctor: 'https://myiqdeonxuznvhtsvfxg.supabase.co/functions/v1/painel-canais',
           acesso: 'https://dfvmuqxjdcvwskrrdbfm.supabase.co/functions/v1/painel-canais' };
var MAX_LISTA = 93;

/* ---------- sessão do portal (login único) ---------- */
function lsLe(k){ try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function portalNovo(){ try { return window.parent !== window && typeof window.parent.__portalSessao === 'function'; } catch (e) { return false; } }
var NO_PORTAL = (function(){ try { return window.parent !== window && window.parent.location.origin === location.origin; } catch (e) { return false; } })();
function sessaoPortal(){
  try {
    if (portalNovo()) return window.parent.__portalSessao() || null;
    if (NO_PORTAL) { var s = localStorage.getItem('meu_desempenho_sessao');
      if (s) return { sessao: s, device_id: localStorage.getItem('meu_desempenho_device') || '' }; }
  } catch (e) {}
  return null;
}
function avisaPortalRelogar(msg){
  if (NO_PORTAL) try { window.parent.postMessage({tipo: 'canais-relogar', msg: msg || ''}, location.origin); } catch (e) {}
}
function pede(marca, corpo){
  var s = sessaoPortal();
  var b = Object.assign({sessao: s ? s.sessao : '', device_id: (s && s.device_id) || lsLe('meu_desempenho_device')}, corpo);
  return fetch(FN[marca], {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(b), cache: 'no-store'})
    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){
      if (!r.ok || j.error) { var e = new Error(j.error || ('erro ' + r.status));
        e.relogar = !!j.relogar; e.sem_acesso = !!j.sem_acesso; throw e; }
      return j; }); });
}

/* ---------- regras fixas ---------- */
var MARCAS = [{id: 'doctor', nome: 'Doctor'}, {id: 'acesso', nome: 'Acesso'}];
var GRUPOS = [
  {id: 'pago',    nome: 'Anúncio',               cor: 'var(--g-pago)',    canais: ['Meta Ads', 'Meta sem id do anúncio', 'Google Ads', 'Reativado por anúncio']},
  {id: 'naopago', nome: 'Não pago',              cor: 'var(--g-naopago)', canais: ['Direto / sem origem', 'Social orgânico', 'Site e busca']},
  {id: 'fora',    nome: 'Equipe e base',         cor: 'var(--g-fora)',    canais: ['Criado pela equipe', 'Base importada']},
  {id: 'sem',     nome: 'Sem ligação com o CRM', cor: 'var(--g-sem)',     canais: ['Sem rastreio (pré-CRM)']}
];
var GRUPO_DO = {}; GRUPOS.forEach(function(g){ g.canais.forEach(function(c){ GRUPO_DO[c] = g; }); });
var META = {'Meta Ads': 1, 'Meta sem id do anúncio': 1};
/* Regra do Henrique (14/10): chegou pelo anúncio da agência no período e fechou = paciente da agência,
   mesmo que já estivesse na base. O pagamento desse paciente a partir do clique sai do canal por onde
   ele tinha chegado e entra aqui (agencia_caixa v4, linhas com `reat`). */
var REAT_CANAL = 'Reativado por anúncio';
var NOME_CANAL = {'Sem rastreio (pré-CRM)': 'Sem ligação com o CRM', 'Direto / sem origem': 'Direto / sem origem',
                  'Meta sem id do anúncio': 'Meta (anúncio sem código)'};
var AG_COR = {'Vanguarda': 'var(--ag-vanguarda)', 'FSX': 'var(--ag-fsx)', 'VX': 'var(--ag-vx)'};
var AG_ORDEM = ['Vanguarda', 'FSX', 'VX'];
var SEM_AG = 'Não identificada';
/* odonto: venda fora do Feegow — fora do retorno e do custo por paciente */
var VENDA_FORA = {'0085': 1, '0279': 1};
/* Acesso: a agência de cada conta pela vigência (a mesma agencia_da_conta do banco da Acesso) */
var CONTAS_ACESSO = [
  {suf: '0418', ag: 'Vanguarda', ger: 'Acesso Saúde'},
  {suf: '0279', ag: 'VX',  ger: 'Doctor Acesso · odonto', ate: '2026-09-30'},
  {suf: '0279', ag: 'FSX', ger: 'Doctor Acesso · odonto', de: '2026-10-01'}
];
var SIT = [
  {id: 'realizado', nome: 'Cobrar',   tit: 'Atendido ou executado e não pago'},
  {id: 'passou',    nome: 'Remarcar', tit: 'Tinha horário, faltou, desmarcou ou ficou sem baixa'},
  {id: 'sem_data',  nome: 'Agendar',  tit: 'Fechou e não tem horário marcado'},
  {id: 'marcado',   nome: 'Marcado',  tit: 'Tem horário adiante'}
];
var SIT_NOME = {}; SIT.forEach(function(s){ SIT_NOME[s.id] = s.nome; });

/* ---------- formatação ---------- */
function brl(v, c){ if (Math.abs(v || 0) < (c ? 0.005 : 0.5)) v = 0; return (v || 0).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL', minimumFractionDigits: c ? 2 : 0, maximumFractionDigits: c ? 2 : 0}); }
function n0(v){ return (v || 0).toLocaleString('pt-BR'); }
function pct(a, b){ return b ? (100 * a / b).toFixed(1).replace('.', ',') + '%' : '—'; }
function vezes(a, b){ return b > 0.5 ? (a / b).toFixed(1).replace('.', ',') + '×' : '—'; }
function br(d){ if (!d) return ''; var p = String(d).slice(0, 10).split('-'); return p[2] + '/' + p[1]; }
function br4(d){ if (!d) return ''; var p = String(d).slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }
function semAcento(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function novaData(s, delta){ var p = s.split('-'); var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); d.setUTCDate(d.getUTCDate() + delta); return d.toISOString().slice(0, 10); }
function diasEntre(a, b){ return Math.round((Date.parse(b) - Date.parse(a)) / 864e5) + 1; }
function agCor(ag){ return AG_COR[ag] || 'var(--ag-outra)'; }
function agTag(ag){ return ag ? '<span class="tag ag" style="--chipc:' + agCor(ag) + '">' + esc(ag) + '</span>' : ''; }

/* ---------- estado ---------- */
var S = {de: '', ate: '', marca: 'todas', ag: 'todas', presetSel: null,
         abSit: 'todas', abOrig: 'todas', abBusca: '', abN: 40,
         pgOrig: 'todas', pgBusca: '', pgN: 40,
         adsOrd: 'v', adsDir: -1, adsTodos: false, agAbertas: {}};
var OK = [];                 // marcas que carregaram
var GERADO = {};
var CAN = [], MID = [], SER = [], CX = [], ADS = [], REF = [], NOME_AD = {};
var LISTAS = {};             // cache de aberto/rastro por marca|ação|de|ate

/* ---------- carga ---------- */
function carrega(){
  if (!sessaoPortal()) {
    document.getElementById('carregando').innerHTML = NO_PORTAL
      ? 'O portal foi atualizado. Aperte F5 e entre de novo.'
      : 'Esta aba abre dentro do portal de relatórios — <a href="' + PORTAL + '#canais" target="_top">abrir no portal</a>.';
    return;
  }
  var falhas = [];
  Promise.all(MARCAS.map(function(m){
    return pede(m.id, {action: 'dados'}).then(function(d){ absorve(m.id, d); OK.push(m.id); })
      .catch(function(e){ falhas.push({m: m, e: e}); });
  })).then(function(){
    OK.sort(function(a, b){ return a === 'doctor' ? -1 : 1; });
    if (!OK.length) {
      var relogar = falhas.some(function(f){ return f.e.relogar; });
      if (relogar) avisaPortalRelogar('Sua sessão acabou. Entre de novo.');
      document.getElementById('carregando').innerHTML = relogar ? 'Sua sessão acabou. Entre de novo no portal.'
        : falhas.every(function(f){ return f.e.sem_acesso; }) ? 'O Canais é só para administrador.'
        : 'Não consegui carregar: ' + falhas.map(function(f){ return esc(f.m.nome) + ' — ' + esc(f.e.message); }).join(' · ');
      return;
    }
    if (falhas.length) {
      var a = document.getElementById('aviso');
      a.innerHTML = falhas.map(function(f){ return '<b>' + esc(f.m.nome) + '</b> não carregou (' + esc(f.e.message) + ').'; }).join(' ');
      a.classList.remove('oculto');
    }
    inicia();
  });
}

function absorve(m, d){
  GERADO[m] = d.gerado_em || '';
  (d.canais || []).forEach(function(x){
    CAN.push({m: m, d: x.d, c: x.c, ch: x.ch || 0, ct: x.ct || 0, p: x.p || 0, v: x.v || 0, pg: x.pg || 0, ab: x.ab || 0, pgd: x.pgd || 0}); });
  (d.midia || []).forEach(function(r){
    var id = String(r[3]);
    MID.push({m: m, d: r[0], id: id, suf: id.slice(-4), inv: r[4] || 0, conv: r[7] || 0});
    if (!NOME_AD[id] || r[0] > NOME_AD[id].d) NOME_AD[id] = {d: r[0], nome: r[2] || r[1] || id, camp: r[1] || ''};
  });
  (d.agencia_caixa || []).forEach(function(x){
    CX.push({m: m, d: x.d, ag: x.ag === 'Anúncio não identificado' ? SEM_AG : x.ag, dc: x.dc || '', v: (x.pgd || 0) + (x.fora || 0),
             reat: !!x.reat, ch: x.ch || ''}); });
  if (m === 'doctor') {
    ((d.agencias && d.agencias.ref) || []).forEach(function(r){
      if (r.ag === SEM_AG) return;
      REF.push({m: m, ag: r.ag, suf: r.suf || '', ger: r.ger || '', de: r.vig_de || '', ate: r.vig_ate || ''}); });
    ((d.agencias && d.agencias.serie) || []).forEach(function(x){
      if (x.ag === SEM_AG) return;
      SER.push({m: m, d: x.d, ag: x.ag, suf: x.suf || '', r: x.r || 0, p: x.p || 0, v: x.v || 0, pg: x.pg || 0, ab: x.ab || 0,
                inv: x.inv || 0, xp: x.xp || 0, xc: x.xc || 0, xv: x.xv || 0, xpg: x.xpg || 0, sv: x.sv || 0, spg: x.spg || 0}); });
    (d.agencia_ads || []).forEach(function(x){
      /* linha `reat` (agencia_anuncios v4): quem já era da base e voltou por este anúncio — conta como dele */
      ADS.push({m: m, d: x.d, a: String(x.a), r: (x.r || 0) + (x.xp || 0), p: (x.p || 0) + (x.xc || 0),
                v: (x.v || 0) + (x.xv || 0), pg: (x.pg || 0) + (x.xpg || 0), ab: (x.ab || 0) + (x.xv || 0) - (x.xpg || 0)}); });
  } else {
    CONTAS_ACESSO.forEach(function(c){ REF.push({m: m, ag: c.ag, suf: c.suf, ger: c.ger, de: c.de || '', ate: c.ate || ''}); });
    /* sem série de agência publicada: monta a mesma série pela jornada (funil por anúncio) e pela mídia */
    var k = {};
    function linha(dia, suf){
      var ag = agDe(m, suf, dia); if (ag === SEM_AG) return null;
      var c = dia + '|' + suf;
      return k[c] || (k[c] = {m: m, d: dia, ag: ag, suf: suf, r: 0, p: 0, v: 0, pg: 0, ab: 0, inv: 0, xp: 0, xc: 0, xv: 0, xpg: 0, sv: 0, spg: 0});
    }
    (d.jornada || []).forEach(function(x){
      var a = String(x.a), o = linha(x.d, a.slice(-4));
      ADS.push({m: m, d: x.d, a: a, r: x.r || 0, p: x.p || 0, v: x.v || 0, pg: x.pg || 0, ab: x.ab || 0});
      if (!o) return; o.r += x.r || 0; o.p += x.p || 0; o.v += x.v || 0; o.pg += x.pg || 0; o.ab += x.ab || 0; });
    MID.forEach(function(r){ if (r.m !== m) return; var o = linha(r.d, r.suf); if (o) o.inv += r.inv; });
    Object.keys(k).forEach(function(c){ SER.push(k[c]); });
  }
}

function agDe(m, suf, dia){
  for (var i = 0; i < REF.length; i++) {
    var r = REF[i];
    if (r.m === m && r.suf === suf && (!r.de || dia >= r.de) && (!r.ate || dia <= r.ate)) return r.ag;
  }
  return SEM_AG;
}
function gerDe(m, suf){
  for (var i = 0; i < REF.length; i++) if (REF[i].m === m && REF[i].suf === suf && REF[i].ger) return REF[i].ger;
  return 'conta ' + suf;
}

/* ---------- filtros ---------- */
function inicia(){
  var dias = CAN.map(function(x){ return x.d; }).sort();
  var pri = dias[0], ult = dias[dias.length - 1];
  S.ult = ult; S.pri = pri;
  var meses = {}; dias.forEach(function(d){ meses[d.slice(0, 7)] = 1; });
  var nomes = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  S.presets = [{r: '7 dias', de: novaData(ult, -6), ate: ult}, {r: '30 dias', de: novaData(ult, -29), ate: ult}];
  Object.keys(meses).sort().slice(-3).forEach(function(ym){
    var a = +ym.slice(0, 4), mm = +ym.slice(5, 7);
    var fim = new Date(Date.UTC(a, mm, 0)).toISOString().slice(0, 10);
    S.presets.push({r: nomes[mm - 1], de: ym + '-01', ate: fim < ult ? fim : ult});
  });
  S.presets.push({r: 'Tudo', de: pri, ate: ult});
  var atual = S.presets[S.presets.length - 2];
  S.de = atual.de; S.ate = atual.ate; S.presetSel = atual.r;
  document.getElementById('fDe').min = pri; document.getElementById('fDe').max = ult;
  document.getElementById('fAte').min = pri; document.getElementById('fAte').max = ult;
  ['fDe', 'fAte'].forEach(function(id){ document.getElementById(id).addEventListener('change', function(){
    var a = document.getElementById('fDe').value, b = document.getElementById('fAte').value;
    if (!a || !b) return; if (a > b) { var t = a; a = b; b = t; }
    S.de = a; S.ate = b; S.presetSel = null; render(); }); });
  document.getElementById('abBusca').addEventListener('input', function(e){ S.abBusca = e.target.value; S.abN = 40; pintaAberto(); });
  document.getElementById('pgBusca').addEventListener('input', function(e){ S.pgBusca = e.target.value; S.pgN = 40; pintaPagou(); });
  if (OK.length < 2) document.getElementById('lMarca').classList.add('oculto');
  pintaFrescor();
  document.getElementById('carregando').classList.add('oculto');
  document.getElementById('conteudo').classList.remove('oculto');
  render();
}

function chip(rot, on, attrs, cor, n){
  return '<button class="chip" ' + attrs + ' aria-pressed="' + (on ? 'true' : 'false') + '"' + (cor ? ' style="--chipc:' + cor + '"' : '') + '>' +
    (cor ? '<span class="dot"></span>' : '') + esc(rot) + (n != null ? '<span class="n">' + n + '</span>' : '') + '</button>';
}
function liga(id, attr, fn){
  Array.prototype.forEach.call(document.getElementById(id).querySelectorAll('[' + attr + ']'), function(b){
    b.addEventListener('click', function(){ fn(b.getAttribute(attr)); }); });
}
function pintaFiltros(){
  document.getElementById('fPer').innerHTML = S.presets.map(function(p, i){
    return chip(p.r, S.presetSel === p.r, 'data-p="' + i + '"'); }).join(' ');
  liga('fPer', 'data-p', function(i){ var p = S.presets[+i]; S.de = p.de; S.ate = p.ate; S.presetSel = p.r; render(); });
  document.getElementById('fDe').value = S.de; document.getElementById('fAte').value = S.ate;
  document.getElementById('fMarca').innerHTML = [chip('As duas', S.marca === 'todas', 'data-m="todas"')].concat(

  liga('fMarca', 'data-m', function(m){ S.marca = m; S.ag = 'todas'; render(); });
  var ags = agenciasAtivas();
  if (S.ag !== 'todas' && ags.indexOf(S.ag) < 0) S.ag = 'todas';
  document.getElementById('fAg').innerHTML = [chip('Todas', S.ag === 'todas', 'data-a="todas"')].concat(
    ags.map(function(a){ return chip(a, S.ag === a, 'data-a="' + esc(a) + '"', agCor(a)); })).join(' ');
  liga('fAg', 'data-a', function(a){ S.ag = a; S.agAbertas = {}; render(); });
}
function pintaFrescor(){
  var hoje = new Date(Date.now() - 4 * 3600e3).toISOString().slice(0, 10);
  document.getElementById('frescor').textContent = 'dados até ' + br(S.ult) + ' · ' + OK.map(function(m){
    var g = String(GERADO[m] || ''); var dia = g.slice(0, 10);
    return (m === 'doctor' ? 'Doctor ' : 'Acesso ') + (dia === hoje ? 'hoje' : br(dia)) + ' ' + g.slice(11, 16);

/* ---------- agregações ---------- */
function daMarca(x){ return S.marca === 'todas' || x.m === S.marca; }
function noPer(x){ return x.d >= S.de && x.d <= S.ate && daMarca(x); }
function agenciasAtivas(){
  var t = {};
  SER.forEach(function(x){ if (noPer(x) && (x.inv > 0.5 || x.r || x.p || x.v)) t[x.ag] = 1; });
  CX.forEach(function(x){ if (noPer(x) && x.ag !== SEM_AG && x.v > 0.5) t[x.ag] = 1; });
  return Object.keys(t).sort(function(a, b){ return (AG_ORDEM.indexOf(a) + 99) % 99 - (AG_ORDEM.indexOf(b) + 99) % 99 || a.localeCompare(b); });
}
function porCanal(){
  var m = {};
  CAN.forEach(function(x){ if (!noPer(x)) return;
    var o = m[x.c] || (m[x.c] = {c: x.c, ch: 0, ct: 0, p: 0, v: 0, pg: 0, ab: 0, pgd: 0});
    ['ch', 'ct', 'p', 'v', 'pg', 'ab', 'pgd'].forEach(function(k){ o[k] += x[k]; }); });
  function linha(c){ return m[c] || (m[c] = {c: c, ch: 0, ct: 0, p: 0, v: 0, pg: 0, ab: 0, pgd: 0}); }
  CX.forEach(function(x){ if (!x.reat || !noPer(x)) return;
    linha(x.ch || 'Direto / sem origem').pgd -= x.v; linha(REAT_CANAL).pgd += x.v; });
  return m;
}
function soma(lista, k){ return lista.reduce(function(a, x){ return a + (x[k] || 0); }, 0); }
function zeroAg(){ return {r: 0, p: 0, v: 0, pg: 0, ab: 0, inv: 0, invMed: 0, xp: 0, xc: 0, xv: 0, xpg: 0, sv: 0, spg: 0,
  pChe: 0, vChe: 0, pgChe: 0, abChe: 0, caixa: 0, cxReat: 0, antes: 0, contas: {}}; }
function zeroConta(m, suf){ return {m: m, suf: suf, r: 0, p: 0, v: 0, pg: 0, ab: 0, inv: 0, xp: 0, xc: 0, xv: 0}; }
/* r/p/v/pg/ab já somam quem chegou pela agência + quem já era da base e voltou pelo anúncio dela
   (xp/xc/xv/xpg da agencia_serie). *Che = quem chegou pela agência, contando também o que depois
   saiu para outra agência (sv/spg) — é a mesma régua dos canais, para fechar a linha de sobra. */
function somaSerie(o, x){
  o.r += x.r + x.xp; o.p += x.p + x.xc; o.v += x.v + x.xv; o.pg += x.pg + x.xpg; o.ab += x.ab + (x.xv - x.xpg);
  o.inv += x.inv; o.xp += x.xp; o.xc += x.xc; o.xv += x.xv;
  if ('pChe' in o) { o.xpg += x.xpg; o.sv += x.sv; o.spg += x.spg; o.pChe += x.p;
    o.vChe += x.v + x.sv; o.pgChe += x.pg + x.spg; o.abChe += x.ab + (x.sv - x.spg); }
}
function porAgencia(){
  var m = {};
  SER.forEach(function(x){ if (!noPer(x)) return;
    var o = m[x.ag] || (m[x.ag] = zeroAg());
    var kc = x.m + '|' + x.suf, c = o.contas[kc] || (o.contas[kc] = zeroConta(x.m, x.suf));
    somaSerie(o, x); somaSerie(c, x);
    if (!VENDA_FORA[x.suf]) o.invMed += x.inv; });
  CX.forEach(function(x){ if (!noPer(x) || x.ag === SEM_AG) return;   /* sem agência: vai para a linha de sobra */
    var o = m[x.ag] || (m[x.ag] = zeroAg());
    o.caixa += x.v; if (x.reat) o.cxReat += x.v; if (x.dc && x.dc < S.de) o.antes += x.v; });
  return m;
}
function pacMed(o){ /* pacientes das contas que vendem pelo Feegow (odonto fora) */
  return Object.keys(o.contas).reduce(function(a, k){ return a + (VENDA_FORA[o.contas[k].suf] ? 0 : o.contas[k].p); }, 0);
}
/* Resumo do anúncio — o mesmo número nos indicadores e na linha Total das agências.
   Leads = telefones que chegaram pelo anúncio de cada agência (+ quem já era da base e voltou pelo anúncio)
   + leads do Google e do Meta sem código. Pacientes, faturado, recebido e em aberto = canais pagos
   (quem chegou) + os que voltaram pelo anúncio; a sobra dos canais vira "Sem agência identificada". */
function resumoPago(can, ags){
  var R = {inv: 0, invMed: 0, rAg: 0, rRes: 0, p0: 0, v0: 0, pg0: 0, ab0: 0, vMeta: 0,
           pChe: 0, vChe: 0, pgChe: 0, abChe: 0, xc: 0, xv: 0, xpg: 0, sv: 0, spg: 0, pFora: 0, cxAg: 0, cxSem: 0};
  Object.keys(can).forEach(function(c){ var o = can[c]; if (!GRUPO_DO[c] || GRUPO_DO[c].id !== 'pago') return;
    R.p0 += o.p; R.v0 += o.v; R.pg0 += o.pg; R.ab0 += o.ab;
    if (META[c]) R.vMeta += o.v;
    if (c !== 'Meta Ads' && c !== REAT_CANAL) R.rRes += o.ct; });
  MID.forEach(function(x){ if (!noPer(x)) return; R.inv += x.inv; if (!VENDA_FORA[x.suf]) R.invMed += x.inv; });
  Object.keys(ags).forEach(function(a){ var o = ags[a];
    R.rAg += o.r; R.pChe += o.pChe; R.vChe += o.vChe; R.pgChe += o.pgChe; R.abChe += o.abChe;
    R.xc += o.xc; R.xv += o.xv; R.xpg += o.xpg; R.sv += o.sv; R.spg += o.spg; R.cxAg += o.caixa;
    R.pFora += o.p - pacMed(o); });
  R.cxSem = soma(CX.filter(function(x){ return noPer(x) && x.ag === SEM_AG; }), 'v');
  R.r = R.rAg + R.rRes;
  /* o que saiu da agência de chegada (sv) entra na do clique (xv): conta uma vez só */
  R.p = R.p0 + R.xc; R.v = R.v0 + R.xv - R.sv; R.pg = R.pg0 + R.xpg - R.spg;
  R.ab = R.ab0 + (R.xv - R.xpg) - (R.sv - R.spg);
  R.vMeta += R.xv - R.sv; R.pMed = R.p - R.pFora;
  R.caixa = R.cxAg + R.cxSem;
  /* sobra: o que os canais pagos têm e nenhuma agência explica (só quem chegou) */
  R.res = {p: R.p0 - R.pChe, v: R.v0 - R.vChe, pg: R.pg0 - R.pgChe, ab: R.ab0 - R.abChe};
  return R;
}

/* ---------- render ---------- */
function render(){
  pintaFiltros();
  var can = porCanal(), ags = porAgencia();
  pintaKpis(can, ags);
  var todas = S.ag === 'todas';
  document.getElementById('sOrigem').classList.toggle('oculto', !todas);
  if (todas) pintaOrigem(can);
  pintaAgencias(can, ags);
  pintaAds();
  carregaListas();
}

function kpi(k, v, d, tit, cor){
  return '<div class="kpi' + (cor ? ' dest' : '') + '"' + (cor ? ' style="--chipc:' + cor + '"' : '') + (tit ? ' title="' + esc(tit) + '"' : '') + '>' +
    '<div class="k">' + esc(k) + '</div><div class="v">' + v + '</div>' + (d ? '<div class="d">' + d + '</div>' : '') + '</div>';
}
function pintaKpis(can, ags){
  var el = document.getElementById('kpis'), h = '';
  var inv = soma(MID.filter(noPer), 'inv');
  if (S.ag === 'todas') {
    var tot = 0, R = resumoPago(can, ags);
    Object.keys(can).forEach(function(c){ tot += can[c].pgd; });
    h += kpi('Caixa no período', brl(tot), 'pagamentos no Feegow', 'Tudo o que entrou no Feegow no período, de todas as origens');
    h += kpi('Caixa de anúncio', brl(R.caixa), pct(R.caixa, tot) + ' do caixa', 'Pagamentos no período de quem chegou por anúncio, ou já era da base e voltou pelo anúncio (a partir do clique)');
    h += kpi('Investimento', brl(R.inv), 'custo por lead ' + (R.r ? brl(R.inv / R.r, 1) : '—'), 'Meta Ads no período');
    h += kpi('Leads de anúncio', n0(R.r), '', 'Telefones que chegaram por anúncio no período');
    h += kpi('Pacientes de anúncio', n0(R.p), pct(R.p, R.r) + ' dos leads' + (R.xc ? ' · ' + n0(R.xc) + ' já eram da base' : ''), 'Chegaram pelo anúncio no período e fecharam no Feegow — inclui quem já era da base e voltou pelo anúncio');
    h += kpi('Faturado', brl(R.v), 'recebido ' + brl(R.pg), 'Contas abertas no Feegow por quem chegou pelo anúncio no período (de quem já era da base, só a partir do clique)');
    h += kpi('Retorno', vezes(R.vMeta, R.invMed), 'custo por paciente ' + (R.pMed ? brl(R.invMed / R.pMed, 1) : '—'), 'Faturado do Meta ÷ investimento (sem as contas de odonto, que vendem fora do Feegow)');
    h += kpi('Em aberto', brl(R.ab), pct(R.ab, R.v) + ' do faturado', 'Faturado e ainda não pago, de quem chegou pelo anúncio no período');
  } else {
    var o = ags[S.ag] || zeroAg(), cor = agCor(S.ag), pm = pacMed(o);
    h += kpi('Caixa da agência', brl(o.caixa), o.cxReat > 0.5 ? brl(o.cxReat) + ' de quem já era da base' : brl(o.antes) + ' de quem chegou antes',
      'Pagamentos no período de pacientes que chegaram pelo anúncio desta agência (de quem já era da base, a partir do clique)', cor);
    h += kpi('Investimento', brl(o.inv), 'custo por lead ' + (o.r ? brl(o.inv / o.r, 1) : '—'), 'Meta Ads das contas desta agência', cor);
    h += kpi('Leads', n0(o.r), '', 'Telefones que chegaram pelo anúncio desta agência no período (inclui quem já era da base)', cor);
    h += kpi('Pacientes', n0(o.p), pct(o.p, o.r) + ' dos leads' + (o.xc ? ' · ' + n0(o.xc) + ' já eram da base' : ''), 'Chegaram pelo anúncio desta agência no período e fecharam', cor);
    h += kpi('Faturado', brl(o.v), 'recebido ' + brl(o.pg), '', cor);
    h += kpi('Retorno', vezes(o.v, o.invMed), 'custo por paciente ' + (pm ? brl(o.invMed / pm, 1) : '—'), 'Faturado ÷ investimento, sem as contas de odonto', cor);
    h += kpi('Em aberto', brl(o.ab), pct(o.ab, o.v) + ' do faturado', '', cor);
    h += o.xp ? kpi('Já eram da base', brl(o.xv), n0(o.xc) + ' de ' + n0(o.xp) + ' fecharam · já no faturado', 'Pacientes que já eram da clínica, clicaram no anúncio desta agência e fecharam — contam como dela', cor)
              : kpi('Já eram da base', brl(o.cxReat), 'pagos a partir do clique', 'Pagamentos de quem já era da clínica e voltou pelo anúncio desta agência', cor);
  }
  el.innerHTML = h;
}

function pintaOrigem(can){
  var tot = 0, porG = {};
  Object.keys(can).forEach(function(c){ tot += can[c].pgd; var g = (GRUPO_DO[c] || GRUPOS[1]).id; porG[g] = (porG[g] || 0) + can[c].pgd; });
  document.getElementById('barra').innerHTML = GRUPOS.filter(function(g){ return porG[g.id] > 0; }).map(function(g){
    return '<i style="flex:' + porG[g.id].toFixed(2) + ';background:' + g.cor + '" title="' + esc(g.nome) + ': ' + brl(porG[g.id]) + '"></i>'; }).join('');
  document.getElementById('leg').innerHTML = GRUPOS.filter(function(g){ return porG[g.id] > 0; }).map(function(g){
    return '<span><span class="dot" style="background:' + g.cor + '"></span>' + esc(g.nome) + ' <b>' + brl(porG[g.id]) + '</b> · ' + pct(porG[g.id], tot) + '</span>'; }).join('');
  var lin = Object.keys(can).map(function(c){ return can[c]; }).filter(function(o){ return o.pgd > 0.5 || o.ch || o.v; });
  var ordG = {}; GRUPOS.forEach(function(g, i){ ordG[g.id] = i; });
  lin.sort(function(a, b){ return (ordG[(GRUPO_DO[a.c] || GRUPOS[1]).id] - ordG[(GRUPO_DO[b.c] || GRUPOS[1]).id]) || b.pgd - a.pgd; });
  var T = {ch: 0, ct: 0, p: 0, v: 0, pg: 0, ab: 0, pgd: 0};
  var corpo = lin.map(function(o){ Object.keys(T).forEach(function(k){ T[k] += o[k]; });
    var g = GRUPO_DO[o.c] || GRUPOS[1];
    if (o.c === REAT_CANAL) return '<tr title="Já eram da base e voltaram pelo anúncio: o que pagaram depois do clique sai do canal de origem e entra aqui">' +
      '<td><span class="dot" style="background:' + g.cor + '"></span>' + esc(o.c) + '</td><td class="num dim" colspan="6">já eram da base · caixa a partir do clique</td>' +
      '<td class="num b">' + brl(o.pgd) + '</td></tr>';
    return '<tr><td><span class="dot" style="background:' + g.cor + '"></span>' + esc(NOME_CANAL[o.c] || o.c) + '</td>' +
      '<td class="num">' + n0(o.ch) + '</td><td class="num">' + n0(o.ct) + '</td><td class="num">' + n0(o.p) + '</td>' +
      '<td class="num">' + brl(o.v) + '</td><td class="num">' + brl(o.pg) + '</td><td class="num">' + brl(o.ab) + '</td>' +
      '<td class="num b">' + brl(o.pgd) + '</td></tr>'; }).join('');
  document.getElementById('tCanais').innerHTML =
    '<thead><tr><th>Origem</th><th class="num" title="Conversas abertas no período">Conversas</th><th class="num" title="Contatos novos no CRM">Leads novos</th>' +
    '<th class="num" title="Viraram paciente (quem chegou no período)">Pacientes</th><th class="num">Faturado</th><th class="num">Recebido</th>' +
    '<th class="num">Em aberto</th><th class="num" title="Pagamentos no período, pela origem do paciente">Caixa</th></tr></thead>' +
    '<tbody>' + corpo + '</tbody><tfoot><tr><td>Total</td><td class="num">' + n0(T.ch) + '</td><td class="num">' + n0(T.ct) + '</td><td class="num">' + n0(T.p) +
    '</td><td class="num">' + brl(T.v) + '</td><td class="num">' + brl(T.pg) + '</td><td class="num">' + brl(T.ab) + '</td><td class="num">' + brl(T.pgd) + '</td></tr></tfoot>';
}

function celsAg(x){ /* x: inv, r, p, v, pg, ab, cpp, ret, caixa (null = "—") */
  function f(v, fn){ return v == null ? '—' : fn(v); }
  return '<td class="num">' + f(x.inv, brl) + '</td><td class="num">' + f(x.r, n0) + '</td><td class="num">' + n0(x.p) + '</td>' +
    '<td class="num">' + (x.r ? pct(x.p, x.r) : '—') + '</td><td class="num">' + brl(x.v) + '</td><td class="num">' + brl(x.pg) + '</td>' +
    '<td class="num">' + brl(x.ab) + '</td><td class="num">' + f(x.cpp, brl) + '</td><td class="num b">' + (x.ret || '—') + '</td>' +
    '<td class="num">' + (x.caixa > 0.5 ? brl(x.caixa) : '—') + '</td>';
}
function linhaAg(o, classe, attrs, rotulo){
  var pm = pacMed(o);
  return '<tr class="' + classe + '" ' + (attrs || '') + '><td>' + rotulo + '</td>' + celsAg({inv: o.inv, r: o.r, p: o.p, v: o.v, pg: o.pg, ab: o.ab,
    cpp: pm && o.invMed ? o.invMed / pm : null, ret: vezes(o.v, o.invMed), caixa: o.caixa}) + '</tr>';
}
function linhaConta(c){
  var fora = VENDA_FORA[c.suf];
  var rot = (S.marca === 'todas' ? (c.m === 'doctor' ? 'Doctor · ' : 'Acesso · ') : '') + esc(gerDe(c.m, c.suf)) + ' <span class="dim">' + esc(c.suf) + '</span>';
  if (fora) return '<tr class="conta"><td>' + rot + '</td><td class="num">' + brl(c.inv) + '</td><td class="num">' + n0(c.r) + '</td>' +
    '<td class="num">' + n0(c.p) + '</td><td class="num">' + pct(c.p, c.r) + '</td><td colspan="5" class="fora" title="A odonto agenda e cobra fora do Feegow">venda fora do Feegow</td><td class="num">—</td></tr>';
  return '<tr class="conta"><td>' + rot + '</td><td class="num">' + brl(c.inv) + '</td><td class="num">' + n0(c.r) + '</td><td class="num">' + n0(c.p) + '</td>' +
    '<td class="num">' + pct(c.p, c.r) + '</td><td class="num">' + brl(c.v) + '</td><td class="num">' + brl(c.pg) + '</td><td class="num">' + brl(c.ab) + '</td>' +
    '<td class="num">' + (c.p && c.inv ? brl(c.inv / c.p) : '—') + '</td><td class="num">' + vezes(c.v, c.inv) + '</td><td class="num">—</td></tr>';
}
function pintaAgencias(can, ags){
  var nomes = agenciasAtivas().filter(function(a){ return S.ag === 'todas' || a === S.ag; });
  var corpo = '';
  nomes.forEach(function(a){
    var o = ags[a] || zeroAg(); var aberta = S.ag !== 'todas' || S.agAbertas[a];
    corpo += linhaAg(o, 'ag' + (aberta ? ' aberto' : ''), 'data-ag="' + esc(a) + '"', '<span class="dot" style="background:' + agCor(a) + '"></span><span class="nome">' + esc(a) + '</span>');
    if (aberta) Object.keys(o.contas).map(function(k){ return o.contas[k]; })
      .sort(function(x, y){ return y.inv - x.inv || y.r - x.r; })
      .filter(function(c){ return c.inv > 0.5 || c.r || c.p; })
      .forEach(function(c){ corpo += linhaConta(c); });
  });
  var pe = '';
  if (S.ag === 'todas') {
    /* o que o canal chama de anúncio e não tem agência (anúncio sem código, Google, posts da página):
       fecha a tabela com os mesmos totais dos indicadores lá de cima */
    var R = resumoPago(can, ags);
    var res = {inv: null, r: R.rRes || null, p: R.res.p, v: R.res.v, pg: R.res.pg, ab: R.res.ab, cpp: null, ret: '', caixa: R.cxSem};
    if (res.p > 0 || res.v > 0.5 || res.caixa > 0.5 || res.r)
      corpo += '<tr class="residuo"><td title="Anúncio sem código, Google Ads e posts da página">Sem agência identificada</td>' + celsAg(res).replace('<td class="num">' + pct(res.p, res.r) + '</td>', '<td class="num">—</td>') + '</tr>';
    pe = '<tfoot><tr><td>Total</td>' + celsAg({inv: R.inv, r: R.r, p: R.p, v: R.v, pg: R.pg, ab: R.ab, cpp: R.pMed ? R.invMed / R.pMed : null,
      ret: vezes(R.vMeta, R.invMed), caixa: R.caixa}) + '</tr></tfoot>';
  }
  var cab = '<thead><tr><th>Agência</th><th class="num">Investimento</th><th class="num" title="Telefones que chegaram pelo anúncio da agência">Leads</th>' +
    '<th class="num" title="Chegaram pelo anúncio da agência e fecharam — inclui quem já era da base">Pacientes</th><th class="num">Conversão</th><th class="num">Faturado</th><th class="num">Recebido</th><th class="num">Em aberto</th>' +
    '<th class="num" title="Sem as contas de odonto">Custo/paciente</th><th class="num" title="Faturado ÷ investimento, sem as contas de odonto">Retorno</th>' +
    '<th class="num" title="Pagamentos no período de pacientes que a agência trouxe">Caixa</th></tr></thead>';
  document.getElementById('tAg').innerHTML = cab + '<tbody>' + (corpo || '<tr><td colspan="11" class="vazio">Sem agência neste período.</td></tr>') + '</tbody>' + pe;
  Array.prototype.forEach.call(document.querySelectorAll('#tAg tr.ag'), function(tr){
    tr.addEventListener('click', function(){ if (S.ag !== 'todas') return; var a = tr.getAttribute('data-ag');
      S.agAbertas[a] = !S.agAbertas[a]; pintaAgencias(porCanal(), porAgencia()); }); });
}

/* ---------- anúncios ---------- */
function pintaAds(){
  var m = {};
  function lin(mm, id, ag){
    var k = mm + '|' + id + '|' + ag, nm = NOME_AD[id] || {nome: 'anúncio ' + id.slice(-6), camp: ''};
    return m[k] || (m[k] = {m: mm, id: id, ag: ag, nome: nm.nome, camp: nm.camp, inv: 0, r: 0, p: 0, v: 0, pg: 0});
  }
  MID.forEach(function(r){ if (!noPer(r)) return; var ag = agDe(r.m, r.suf, r.d);
    if (S.ag !== 'todas' && ag !== S.ag) return; lin(r.m, r.id, ag).inv += r.inv; });
  ADS.forEach(function(x){ if (!noPer(x)) return; var ag = agDe(x.m, x.a.slice(-4), x.d);
    if (S.ag !== 'todas' && ag !== S.ag) return; var o = lin(x.m, x.a, ag);
    o.r += x.r; o.p += x.p; o.v += x.v; o.pg += x.pg; });
  var lista = Object.keys(m).map(function(k){ var o = m[k]; o.fora = !!VENDA_FORA[o.id.slice(-4)];
    o.ret = o.fora || o.inv < 0.5 ? -1 : o.v / o.inv; return o; })
    .filter(function(o){ return o.inv > 0.5 || o.r || o.p; });
  var k = S.adsOrd, dir = S.adsDir;
  lista.sort(function(a, b){
    var va = k === 'nome' ? semAcento(a.nome) : a[k], vb = k === 'nome' ? semAcento(b.nome) : b[k];
    return (va < vb ? -1 : va > vb ? 1 : 0) * dir || b.inv - a.inv; });
  var inv = soma(lista, 'inv'), vv = soma(lista, 'v');
  document.getElementById('adsTot').innerHTML = '<b>' + n0(lista.length) + '</b> anúncios · <b>' + brl(inv) + '</b> investidos · <b>' + brl(vv) + '</b> faturados';
  var mostra = S.adsTodos ? lista : lista.slice(0, 15);
  function th(id, rot, num, tit){ return '<th' + (num ? ' class="num' : ' class="') + (S.adsOrd === id ? ' ord' + (S.adsDir > 0 ? ' asc' : '') : '') + '" data-ord="' + id + '"' + (tit ? ' title="' + tit + '"' : '') + '>' + rot + '</th>'; }
  document.getElementById('tAds').innerHTML = '<thead><tr>' + th('nome', 'Anúncio') + '<th>Agência</th>' + th('inv', 'Investimento', 1) + th('r', 'Leads', 1) +
    th('p', 'Pacientes', 1) + th('v', 'Faturado', 1) + th('pg', 'Recebido', 1) + th('ret', 'Retorno', 1, 'Faturado ÷ investimento') + '</tr></thead><tbody>' +
    (mostra.map(function(o){
      return '<tr><td><span class="nome">' + esc(o.nome) + '</span><span class="sub">' + esc(o.camp) + (S.marca === 'todas' ? ' · ' + (o.m === 'doctor' ? 'Doctor' : 'Acesso') : '') + '</span></td>' +
        '<td>' + agTag(o.ag === SEM_AG ? '' : o.ag) + '</td><td class="num">' + brl(o.inv) + '</td><td class="num">' + n0(o.r) + '</td><td class="num">' + n0(o.p) + '</td>' +
        (o.fora ? '<td class="fora" colspan="3">venda fora do Feegow</td>'
          : '<td class="num b">' + brl(o.v) + '</td><td class="num">' + brl(o.pg) + '</td><td class="num">' + (o.inv > 0.5 ? vezes(o.v, o.inv) : '—') + '</td>') + '</tr>';
    }).join('') || '<tr><td colspan="8" class="vazio">Nenhum anúncio no período.</td></tr>') + '</tbody>';
  document.getElementById('adsMais').innerHTML = lista.length > 15
    ? '<button class="btn" id="adsBtn">' + (S.adsTodos ? 'Mostrar os 15 primeiros' : 'Ver todos (' + lista.length + ')') + '</button>' : '';
  document.getElementById('adsMais').classList.toggle('oculto', lista.length <= 15);
  var b = document.getElementById('adsBtn'); if (b) b.addEventListener('click', function(){ S.adsTodos = !S.adsTodos; pintaAds(); });
  Array.prototype.forEach.call(document.querySelectorAll('#tAds th[data-ord]'), function(t){
    t.addEventListener('click', function(){ var id = t.getAttribute('data-ord');
      if (S.adsOrd === id) S.adsDir = -S.adsDir; else { S.adsOrd = id; S.adsDir = id === 'nome' ? 1 : -1; } pintaAds(); }); });
}

/* ---------- listas lidas na hora: fechado e não pago, quem pagou ---------- */
var AB = null, PG = null, listaChave = '', listaTimer = null;
function carregaListas(){
  var marcas = OK.filter(function(m){ return S.marca === 'todas' || S.marca === m; });
  var chave = marcas.join(',') + '|' + S.de + '|' + S.ate;
  if (chave === listaChave) { pintaAberto(); pintaPagou(); return; }
  listaChave = chave; AB = PG = null;
  if (diasEntre(S.de, S.ate) > MAX_LISTA) {
    ['tAb', 'tPg'].forEach(function(id){ document.getElementById(id).innerHTML = '<tbody><tr><td class="vazio">Escolha um período de até ' + MAX_LISTA + ' dias para ver a lista.</td></tr></tbody>'; });
    ['abTot', 'pgTot', 'abSit', 'abOrig', 'pgOrig', 'abMais', 'pgMais'].forEach(function(id){ document.getElementById(id).innerHTML = ''; });
    return;
  }
  ['tAb', 'tPg'].forEach(function(id){ document.getElementById(id).innerHTML = '<tbody><tr><td class="vazio">carregando…</td></tr></tbody>'; });
  clearTimeout(listaTimer);
  listaTimer = setTimeout(function(){
    function busca(m, acao){
      var k = m + '|' + acao + '|' + S.de + '|' + S.ate;
      if (LISTAS[k]) return Promise.resolve(LISTAS[k]);
      return pede(m, {action: acao, de: S.de, ate: S.ate}).then(function(j){ LISTAS[k] = j[acao] || []; return LISTAS[k]; })
        .catch(function(e){ if (e.relogar) avisaPortalRelogar(e.message); return {erro: e.message}; });
    }
    var esta = chave;
    Promise.all(marcas.map(function(m){ return busca(m, 'aberto').then(function(r){ return {m: m, r: r}; }); })).then(function(rs){
      if (esta !== listaChave) return;
      AB = []; rs.forEach(function(x){ if (Array.isArray(x.r)) x.r.forEach(function(l){ AB.push(abLinha(x.m, l)); }); else AB.erro = x.r.erro; });
      pintaAberto(); });
    Promise.all(marcas.map(function(m){ return busca(m, 'rastro').then(function(r){ return {m: m, r: r}; }); })).then(function(rs){
      if (esta !== listaChave) return;
      PG = []; rs.forEach(function(x){ if (Array.isArray(x.r)) x.r.forEach(function(l){ if ((l[2] || 0) > 0) PG.push(pgLinha(x.m, l)); }); else PG.erro = x.r.erro; });
      pintaPagou(); });
  }, 250);
}
function grupoDe(canal){ return (GRUPO_DO[canal] || GRUPOS[1]).id; }
/* aberto: [conta, tipo, agencia, canal, dia_ref, fechado, pago, aberto, situacao, data, unidade, anuncio, reat_ag, reat_dia, itens, st, nome] */
function abLinha(m, l){
  var reat = l[1] === 'r';
  return {m: m, conta: l[0], reat: reat, ag: reat ? l[12] : l[2], canal: l[3], dia: l[4], fat: +l[5] || 0, pago: +l[6] || 0, ab: +l[7] || 0,
          sit: l[8], data: l[9], uni: l[10] || '', nome: l[16] || '', g: reat ? 'reat' : grupoDe(l[3])};
}
/* rastro: [d, conta, pago, fat, canal, ag, aid, dc, via, reat_ag, reat_d, procs, uni, desde, base, nome] */
function pgLinha(m, l){
  var ag = l[5] || '', reatAg = l[9] || '', reatD = l[10] || '';
  /* mesma regra da agencia_caixa v4: pago a partir do clique, por quem já era da base e voltou pelo
     anúncio de outra agência, é dessa agência */
  var reat = !!reatAg && !!reatD && l[0] >= reatD && reatAg !== ag && reatAg !== SEM_AG && l[4] !== 'Meta sem id do anúncio';
  return {m: m, d: l[0], conta: l[1], pago: +l[2] || 0, canal: l[4], ag: reat ? reatAg : ag, dc: reat ? reatD : (l[7] || ''),
          procs: l[11] || '', uni: l[12] || '', nome: l[15] || '', g: reat ? 'reat' : grupoDe(l[4])};
}
function origemTxt(g, canal, ag){
  if (g === 'reat') return agTag(ag) + ' <span class="dim">já era da base</span>';
  if (g === 'pago') return ag ? agTag(ag) : esc(NOME_CANAL[canal] || canal);
  return esc(NOME_CANAL[canal] || canal || '—');
}
var ORIG = [{id: 'pago', nome: 'Anúncio'}, {id: 'naopago', nome: 'Não pago'}, {id: 'fora', nome: 'Equipe e base'}, {id: 'sem', nome: 'Sem ligação'}, {id: 'reat', nome: 'Já eram da base'}];

function pintaAberto(){
  var t = document.getElementById('tAb');
  if (AB === null) return;
  if (AB.erro && !AB.length) { t.innerHTML = '<tbody><tr><td class="vazio">Não consegui ler: ' + esc(AB.erro) + '</td></tr></tbody>'; return; }
  var base = AB.filter(function(l){ return S.ag === 'todas' || l.ag === S.ag; });
  var orig = base.filter(function(l){ return S.abOrig === 'todas' || l.g === S.abOrig; });
  var sitT = {}; orig.forEach(function(l){ var o = sitT[l.sit] || (sitT[l.sit] = {n: 0, v: 0}); o.n++; o.v += l.ab; });
  document.getElementById('abSit').innerHTML = [chip('Todas', S.abSit === 'todas', 'data-s="todas"', null, n0(orig.length))].concat(SIT.map(function(s){
    var o = sitT[s.id] || {n: 0, v: 0};
    return chip(s.nome + ' ' + brl(o.v), S.abSit === s.id, 'data-s="' + s.id + '" title="' + esc(s.tit) + '"', null, n0(o.n)); })).join(' ');
  liga('abSit', 'data-s', function(s){ S.abSit = s; S.abN = 40; pintaAberto(); });
  var gT = {}; base.forEach(function(l){ gT[l.g] = (gT[l.g] || 0) + 1; });
  document.getElementById('abOrig').innerHTML = [chip('Toda origem', S.abOrig === 'todas', 'data-o="todas"')].concat(ORIG.filter(function(o){ return gT[o.id]; })
    .map(function(o){ return chip(o.nome, S.abOrig === o.id, 'data-o="' + o.id + '"', null, n0(gT[o.id])); })).join(' ');
  liga('abOrig', 'data-o', function(o){ S.abOrig = o; S.abN = 40; pintaAberto(); });
  var q = semAcento(S.abBusca).trim();
  var lis = orig.filter(function(l){ return (S.abSit === 'todas' || l.sit === S.abSit) &&
    (!q || semAcento(l.nome).indexOf(q) >= 0 || String(l.conta).indexOf(q) >= 0); })
    .sort(function(a, b){ return b.ab - a.ab; });
  var totV = soma(lis, 'ab');
  document.getElementById('abTot').innerHTML = '<b>' + brl(totV) + '</b> · <b>' + n0(lis.length) + '</b> pacientes';
  var mostra = lis.slice(0, S.abN);
  t.innerHTML = '<thead><tr><th>Paciente</th><th>Origem</th><th>Chegou</th><th class="num">Fechado</th><th class="num">Pago</th><th class="num">Em aberto</th>' +
    '<th>Situação</th><th>Data</th><th>Unidade</th></tr></thead><tbody>' + (mostra.map(function(l){
      return '<tr><td><span class="nome">' + esc(l.nome || '—') + '</span><span class="sub">' + esc(l.conta) + '</span></td><td>' + origemTxt(l.g, l.canal, l.ag) + '</td>' +
        '<td>' + br(l.dia) + '</td><td class="num">' + brl(l.fat) + '</td><td class="num">' + brl(l.pago) + '</td><td class="num b">' + brl(l.ab) + '</td>' +
        '<td><span class="sit ' + esc(l.sit) + '">' + esc(SIT_NOME[l.sit] || l.sit || '—') + '</span></td><td>' + br(l.data) + '</td><td class="dim">' + esc(l.uni) + '</td></tr>';
    }).join('') || '<tr><td colspan="9" class="vazio">Ninguém nesta seleção.</td></tr>') + '</tbody>';
  maisBtn('abMais', lis.length, S.abN, function(){ S.abN += 100; pintaAberto(); });
}

function pintaPagou(){
  var t = document.getElementById('tPg');
  if (PG === null) return;
  if (PG.erro && !PG.length) { t.innerHTML = '<tbody><tr><td class="vazio">Não consegui ler: ' + esc(PG.erro) + '</td></tr></tbody>'; return; }
  var base = PG.filter(function(l){ return S.ag === 'todas' || l.ag === S.ag; });
  var gT = {}; base.forEach(function(l){ gT[l.g] = (gT[l.g] || 0) + l.pago; });
  document.getElementById('pgOrig').innerHTML = [chip('Toda origem', S.pgOrig === 'todas', 'data-o="todas"')].concat(ORIG.filter(function(o){ return gT[o.id]; })
    .map(function(o){ return chip(o.nome, S.pgOrig === o.id, 'data-o="' + o.id + '"', null, brl(gT[o.id])); })).join(' ');
  liga('pgOrig', 'data-o', function(o){ S.pgOrig = o; S.pgN = 40; pintaPagou(); });
  var q = semAcento(S.pgBusca).trim();
  var lis = base.filter(function(l){ return (S.pgOrig === 'todas' || l.g === S.pgOrig) &&
    (!q || semAcento(l.nome).indexOf(q) >= 0 || String(l.conta).indexOf(q) >= 0 || semAcento(l.procs).indexOf(q) >= 0); })
    .sort(function(a, b){ return a.d < b.d ? 1 : a.d > b.d ? -1 : b.pago - a.pago; });
  var pac = {}; lis.forEach(function(l){ pac[l.m + l.conta] = 1; });
  document.getElementById('pgTot').innerHTML = '<b>' + brl(soma(lis, 'pago')) + '</b> · <b>' + n0(Object.keys(pac).length) + '</b> pacientes';
  var mostra = lis.slice(0, S.pgN);
  t.innerHTML = '<thead><tr><th>Data</th><th>Paciente</th><th>Origem</th><th>Chegou</th><th class="num">Pago</th><th>Procedimentos</th><th>Unidade</th></tr></thead><tbody>' +
    (mostra.map(function(l){
      return '<tr><td>' + br(l.d) + '</td><td><span class="nome">' + esc(l.nome || '—') + '</span><span class="sub">' + esc(l.conta) + '</span></td>' +
        '<td>' + origemTxt(l.g, l.canal, l.ag) + '</td>' +
        '<td>' + (l.dc ? br4(l.dc) : '—') + '</td><td class="num b">' + brl(l.pago, 1) + '</td><td><span class="sub" style="color:var(--ink-2)">' + esc(l.procs) + '</span></td>' +
        '<td class="dim">' + esc(l.uni) + '</td></tr>';
    }).join('') || '<tr><td colspan="7" class="vazio">Ninguém nesta seleção.</td></tr>') + '</tbody>';
  maisBtn('pgMais', lis.length, S.pgN, function(){ S.pgN += 100; pintaPagou(); });
}
function maisBtn(id, total, n, fn){
  var el = document.getElementById(id);
  el.classList.toggle('oculto', total <= n);
  el.innerHTML = total > n ? '<button class="btn">Mostrar mais (' + n0(total - n) + ')</button>' : '';
  if (total > n) el.firstChild.addEventListener('click', fn);
}

carrega();
