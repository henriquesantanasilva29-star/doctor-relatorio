<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Grupo JOB — de onde vem o paciente</title>
<script></script>
<style>
/* Design System Life CRM (Arasys) — tokens oficiais.
   Rosa #F5136E é a ação. O gradiente roxo→rosa→laranja é o DNA da marca e
   aparece em UM elemento por tela, só na capa. */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400;500&display=swap');
:root{
  --red:#F5136E; --dark:#1B1830; --gray-bg:#F4F2F8; --gray-text:#7E7796;
  --border:#E9E6F0; --alert-bg:#FFF0F6; --green:#14B879; --purple:#8E2DE2;
  --orange:#FF8A1E; --blue:#3E7BFA; --mute:#A9A3BC;
  --surface-page:#FAF9FC; --text-body:#443E5C;
  --grad-brand:linear-gradient(135deg,#8E2DE2 0%,#F5136E 52%,#FF8A1E 100%);
  --font-display:'Poppins',system-ui,-apple-system,sans-serif;
  --font-body:'DM Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'DM Mono','SF Mono',Consolas,monospace;
  --r-sm:8px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --shadow-xs:0 1px 2px rgba(27,24,48,.06); --shadow-sm:0 2px 6px rgba(27,24,48,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);background:var(--surface-page);
  color:var(--text-body);-webkit-font-smoothing:antialiased;line-height:1.55}
h1,h2,h3,h4,.kpi-val,.result-num,.ad-name,.passo .pv,.et .v,.esc-v,.cob-v{font-family:var(--font-display)}
.num,.kpi-val,.result-num,.ad-stat-val,.passo .pv,.et .v,.esc-v,.cob-v{font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:28px 24px 60px}

/* ---- capa e campo de período ---- */
.capa{background:var(--grad-brand);border-radius:var(--r-lg);padding:26px 30px;margin-bottom:22px;color:#fff}
.capa .logo{height:26px;margin-bottom:14px;display:block;filter:brightness(0) invert(1)}
.capa h1{font-size:28px;margin:0;font-weight:700;letter-spacing:-.02em;line-height:1.12}
.capa p.sub{margin:6px 0 0;font-size:14px;opacity:.9}
.periodo{margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip-data{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.32);color:#fff;
  border-radius:var(--r-pill);padding:8px 18px;font-family:var(--font-mono);font-size:12.5px;
  cursor:pointer;display:flex;align-items:center;gap:9px;transition:background .15s;font-weight:500}
.chip-data:hover{background:rgba(255,255,255,.34)}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.preset{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);color:#fff;
  border-radius:var(--r-pill);padding:6px 13px;font-size:11.5px;cursor:pointer;font-family:var(--font-body)}
.preset:hover,.preset.on{background:#fff;color:var(--red);border-color:#fff;font-weight:700}
.editor{display:none;gap:10px;align-items:center;flex-wrap:wrap;margin-top:11px;
  background:rgba(255,255,255,.16);padding:11px 15px;border-radius:var(--r-md)}
.editor.aberto{display:flex}
.editor label{font-size:11.5px;opacity:.9}
.editor input{font-family:var(--font-mono);font-size:12.5px;padding:6px 9px;border-radius:6px;
  border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.94);color:var(--dark)}

/* ---- abas ---- */
.tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.tab-btn{padding:10px 18px;border-radius:999px;border:1.5px solid var(--border);background:#fff;
  color:var(--dark);font-size:13.5px;font-weight:700;cursor:pointer;transition:all .15s ease}
.tab-btn:hover{border-color:var(--red)}
.tab-btn.active{background:var(--red);border-color:var(--red);color:#fff}
.panel{display:none;animation:fade .25s ease}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ---- blocos ---- */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.kpi-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);
  padding:14px 12px 14px 16px;position:relative;overflow:hidden;box-shadow:var(--shadow-xs)}
.kpi-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red)}
.kpi-card.pend::before{background:var(--border)}
.kpi-val{font-size:19px;font-weight:700;line-height:1.1;color:var(--dark)}
.kpi-card.pend .kpi-val{color:var(--gray-text);font-size:15px}
.kpi-label{font-size:9.5px;color:var(--gray-text);font-weight:700;margin-top:4px;letter-spacing:.3px}
/* Terceira linha do card. Número sozinho não diz se é bom: "R$ 21 mil em aberto"
   muda de sentido quando vem seguido de "43% do faturado". */
.kpi-sub{font-size:10px;color:var(--gray-text);margin-top:3px;font-weight:500;line-height:1.3}
.kpi-card.verde::before{background:var(--green)}
.kpi-card.roxo::before{background:var(--purple)}
/* terceira linha do cartão: a ressalva que impede o número de ser lido sozinho */
.kpi-det{font-size:9.5px;color:var(--gray-text);margin-top:3px;line-height:1.35}
tr.faixa th{background:#fff;border-bottom:none;padding:0 10px 6px}
.fx{font-size:9.5px;letter-spacing:.4px;text-transform:uppercase;font-weight:700;text-align:right}
.fx-prop{color:var(--purple);border-bottom:2px solid var(--purple)}
.fx-fat{color:var(--green);border-bottom:2px solid var(--green)}
.corte-etapa{font-size:10.5px;color:var(--gray-text);font-weight:700;margin:10px 0 4px;
  padding-top:9px;border-top:1px dashed var(--border)}
.proc-acao{display:flex;justify-content:flex-end;margin-top:10px}
.detalhe-btn{border:1.5px solid var(--border);background:#fff;color:var(--gray-text);
  font-family:inherit;font-size:10.5px;font-weight:700;padding:6px 14px;border-radius:999px;
  cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.detalhe-btn:hover{border-color:var(--red);color:var(--dark)}
/* Aberto, ele é o mesmo chip rosa que marca seleção no resto do relatório —
   antes virava um contorno vermelho que não existia em nenhum outro lugar. */
.detalhe-btn.aberto{background:var(--red);border-color:var(--red);color:#fff}
.proc{margin-top:10px}
/* Mesma tabela do resto do app: cabeçalho no cinza da marca, zebra a cada
   quatro linhas, rodapé com régua escura. Tinha inventado um estilo próprio. */
.tproc{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px;background:#fff}
.tproc thead th{background:var(--gray-bg);color:var(--dark);text-align:left;padding:9px 10px;
  font-weight:600;font-size:11px;border-bottom:1px solid var(--border)}
.tproc tbody td{padding:7px 10px;border-bottom:1px solid var(--border)}
.tproc tbody tr:nth-child(odd){background:var(--gray-bg)}
.tproc tfoot td{padding:8px 10px;font-weight:700;border-top:2px solid var(--dark)}
.tproc .num{text-align:right;font-variant-numeric:tabular-nums}
/* seletor de marca — nasce escondido e só aparece depois que a chave provou
   valer, porque é o endpoint com chave que entrega a lista de marcas irmãs */
.marcas{display:none;gap:8px;justify-content:center;margin:0 0 16px;flex-wrap:wrap}
.marca-btn{padding:8px 16px;border-radius:999px;border:1.5px solid var(--border);background:#fff;
  font-family:inherit;font-size:12px;font-weight:700;color:var(--gray-text);cursor:pointer;
  transition:border-color .15s,color .15s}
.marca-btn:hover{border-color:var(--red);color:var(--dark)}
.marca-btn.atual{background:var(--red);border-color:var(--red);color:#fff;cursor:default}
.marca-btn.atual:hover{color:#fff}
.saude{background:#fff;border:1px solid var(--border);border-left:4px solid var(--green);
  border-radius:var(--r-md);padding:14px 18px;margin-bottom:16px;display:flex;gap:20px;
  align-items:center;flex-wrap:wrap;box-shadow:var(--shadow-xs)}
.saude.media{border-left-color:var(--orange)} .saude.ruim{border-left-color:var(--red)}
.saude.nula{border-left-color:var(--mute)}
.cob-v{font-size:26px;font-weight:700;color:var(--green);line-height:1}
.saude.media .cob-v{color:var(--orange)} .saude.ruim .cob-v{color:var(--red)}
.saude.nula .cob-v{color:var(--gray-text);font-size:17px}
.cob-l{font-size:9px;color:var(--gray-text);font-weight:700;letter-spacing:.3px;margin-top:3px}
.saude .txt{font-size:12.5px;flex:1 1 340px} .saude .txt b{color:var(--dark)}
.barra{height:8px;border-radius:999px;background:var(--border);overflow:hidden;margin-top:7px;max-width:420px}
.barra i{display:block;height:100%;background:var(--green);border-radius:999px}
.saude.media .barra i{background:var(--orange)} .saude.ruim .barra i{background:var(--red)}
.section-title{font-size:14px;font-weight:700;letter-spacing:.4px;color:var(--dark);
  border-bottom:2px solid var(--red);padding-bottom:6px;margin:28px 0 12px}
.result-block{background:var(--gray-bg);border-radius:6px;padding:16px 18px;display:flex;
  align-items:center;gap:16px;flex-wrap:wrap}
.result-num{font-size:30px;font-weight:700;color:var(--red);line-height:1}
.result-label{font-weight:700;font-size:13.5px;color:var(--dark)}
.result-sub{color:var(--gray-text);font-size:12px;margin-top:2px}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.chart-card{border:1px solid var(--border);border-radius:6px;padding:14px;background:#fff}
.chart-card.full{grid-column:1/-1}
.chart-card h4{margin:0 0 10px;font-size:11.5px;color:var(--gray-text);letter-spacing:.3px}
.cv{position:relative;height:330px} .cv.baixa{height:270px}
canvas{max-width:100%}

/* ---- tabelas ---- */
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;background:#fff}
thead th{background:var(--gray-bg);color:var(--dark);text-align:left;padding:10px;font-weight:600;
  font-size:11.5px;border-bottom:1px solid var(--border)}
tbody td{padding:7px 10px;border-bottom:1px solid var(--border)}
tbody tr:nth-child(4n+3){background:var(--gray-bg)}
tbody tr.det, tbody tr.det:nth-child(4n+3){background:#fff}
td.num,th.num{text-align:right}
/* Sem o nowrap "R$ 4.922" quebra em duas linhas na última coluna e o número
   parece dois números. */
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{padding:8px 10px;font-weight:700;border-top:2px solid var(--dark)}
.camp-row{cursor:pointer}
.camp-row:hover{background:var(--alert-bg) !important}
.camp-row td:first-child::after{content:"▸";color:var(--gray-text);margin-left:6px;font-size:10px}
.camp-row.aberta td:first-child::after{content:"▾"}
.det td{padding:0}
.det .box{padding:16px 14px;border-left:3px solid var(--red);background:var(--gray-bg);margin:2px 0 8px}

/* ---- funil e cartões de anúncio ---- */
.passos{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch}
.passo{flex:1 1 112px;background:#fff;border:1px solid var(--border);border-radius:6px;padding:9px 11px}
.passo .pv{font-size:16px;font-weight:700;color:var(--dark)}
.passo .pl{font-size:8.5px;color:var(--gray-text);font-weight:700;margin-top:2px;letter-spacing:.3px}
.passo .pp{font-size:10.5px;color:var(--gray-text);margin-top:3px}
.cob{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700}
.cob.boa{background:#E4F4EA;color:#166534}
.cob.media{background:#FFF3E4;color:#9A4B00}
.cob.ruim{background:#FBEAEA;color:var(--red)}
.cob.nula{background:var(--gray-bg);color:var(--gray-text)}
.det p{font-size:11.5px;color:#555;margin:9px 0 0;line-height:1.5}
.anuncios{display:grid;gap:10px;margin-top:14px}
.anuncio{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);padding:12px;
  display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:start}
.anuncio .foto{width:104px;height:104px;border-radius:var(--r-sm);object-fit:cover;
  background:var(--gray-bg);display:block}
.anuncio .sem-foto{width:104px;height:104px;border-radius:var(--r-sm);background:var(--gray-bg);
  display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:10px;text-align:center;padding:8px}
.anuncio h5{margin:0 0 2px;font-size:13px;font-weight:700;color:var(--dark);font-family:var(--font-display)}
.anuncio .copy{font-size:11.5px;color:#555;white-space:pre-wrap;margin:5px 0 0;
  max-height:74px;overflow:hidden;position:relative;line-height:1.45}
.anuncio .copy.aberta{max-height:none}
.mais{background:none;border:none;color:var(--red);font-size:10.5px;font-weight:700;cursor:pointer;
  padding:3px 0 0;font-family:var(--font-body)}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center}
.tag{font-size:9.5px;background:var(--gray-bg);color:var(--gray-text);border-radius:999px;
  padding:3px 9px;font-weight:700;letter-spacing:.2px}
.tag.acao{background:var(--alert-bg);color:var(--red)}
.tag a{color:inherit;text-decoration:none} .tag a:hover{text-decoration:underline}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:7px;margin-top:10px;
  border-top:1px solid var(--border);padding-top:9px}
.mini div span{display:block}
.mini .mv{font-size:13px;font-weight:700;color:var(--dark);font-variant-numeric:tabular-nums;font-family:var(--font-display)}
.mini .ml{font-size:8.5px;color:var(--gray-text);margin-top:1px;font-weight:700;letter-spacing:.2px}

/* ---- escada de conciliação ---- */
.escada{display:grid;gap:8px;margin-top:6px}
.esc{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;
  border:1px solid var(--border);border-radius:6px;padding:12px 16px;background:#fff}
.esc-v{font-size:22px;font-weight:700;line-height:1}
.esc-l{font-size:9px;color:var(--gray-text);font-weight:700;letter-spacing:.3px;margin-top:3px}
.esc-t{font-size:12px;line-height:1.5} .esc-t b{color:var(--dark)}
.esc.meta{border-left:4px solid var(--purple)} .esc.meta .esc-v{color:var(--purple)}
.esc.crm{border-left:4px solid var(--red)} .esc.crm .esc-v{color:var(--red)}
.esc.gap{border-left:4px solid var(--orange)} .esc.gap .esc-v{color:var(--orange)}

/* ---- esteira, notas, rodapé ---- */
.esteira{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:6px}
.et{border:1px solid var(--border);border-radius:6px;padding:12px 14px;background:#fff}
.et .v{font-size:17px;font-weight:700;color:var(--dark)}
.et .l{font-size:9px;color:var(--gray-text);font-weight:700;margin-top:3px;letter-spacing:.3px}
.et .d{font-size:11px;color:var(--gray-text);margin-top:4px}
.nota{background:var(--alert-bg);border-left:3px solid var(--red);border-radius:6px;
  padding:14px 18px;margin:18px 0;font-size:12.5px}
.nota.neutra{background:var(--gray-bg);border-left-color:var(--purple)}
.nota.aviso{background:#FFF6E9;border-left-color:var(--orange)}
.nota > b:first-child{display:block;margin-bottom:6px;color:var(--dark)}
.nota ul{margin:6px 0 0;padding-left:18px} .nota li{margin:4px 0}
.ok{color:var(--green);font-weight:700}
.vazio{padding:40px;text-align:center;color:var(--gray-text);font-size:13px;
  border:1px dashed var(--border);border-radius:var(--r-md);background:#fff}

/* ---- barras horizontais, no formato dos relatórios diários ----------------
   Rótulo à esquerda, trilho cinza, preenchimento rosa, valor à direita. É a
   mesma leitura do PDF: a pessoa compara comprimento sem procurar eixo. */
.bl{display:grid;gap:7px;margin-top:2px}
.bl-row{display:grid;grid-template-columns:96px 1fr 42px;align-items:center;gap:10px}
.bl-l{font-size:11px;color:var(--gray-text);text-align:right;line-height:1.25}
.bl-t{height:9px;background:var(--gray-bg);border-radius:999px;overflow:hidden}
.bl-t i{display:block;height:100%;background:var(--red);border-radius:999px;
  transition:width .25s ease}
.bl-v{font-size:12px;font-weight:700;color:var(--dark);text-align:right;
  font-variant-numeric:tabular-nums}
.bl-row.fraca .bl-t i{background:#F7A8C6}
.bl-nota{font-size:10.5px;color:var(--gray-text);margin-top:10px;line-height:1.45}

/* ---- filtro de unidade ---- */
.filtro-uni{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:2px 0 16px}
.filtro-uni .rot{font-size:10px;font-weight:700;letter-spacing:.3px;
  color:var(--gray-text);margin-right:2px}
.chip-uni{border:1px solid var(--border);background:#fff;color:var(--dark);
  border-radius:999px;padding:6px 14px;font:inherit;font-size:11.5px;cursor:pointer;
  transition:.15s}
.chip-uni:hover{border-color:var(--red);color:var(--red)}
.chip-uni.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.chip-uni .q{opacity:.6;font-size:10px;margin-left:5px}
.chip-uni.on .q{opacity:.85}

/* ---- vozes dos pacientes ---- */
.voz{border:1px solid var(--border);border-left:3px solid var(--border);
  border-radius:6px;padding:13px 16px;margin-bottom:10px;background:#fff}
.voz.promotor{border-left-color:var(--green);background:#F3FBF7}
.voz.neutro  {border-left-color:var(--gray-text);background:var(--gray-bg)}
.voz.detrator{border-left-color:var(--red);background:var(--alert-bg)}
.voz-topo{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.voz-nota{font-size:9.5px;font-weight:700;letter-spacing:.3px;border-radius:999px;
  padding:3px 9px;background:#fff;border:1px solid var(--border);color:var(--dark)}
.voz.promotor .voz-nota{border-color:#B9E7D2;color:#0C7A50}
.voz.detrator .voz-nota{border-color:#F8C0D6;color:#B00E51}
.voz-quem{font-size:12.5px;font-weight:700;color:var(--dark)}
.voz-meta{font-size:10.5px;color:var(--gray-text)}
.voz-txt{font-size:12.5px;color:var(--dark);line-height:1.55;font-style:italic}
.voz-sug{font-size:12px;color:var(--dark);line-height:1.5;margin-top:7px;
  padding-top:7px;border-top:1px dashed var(--border)}
.voz-sug b{font-style:normal}
.footer{margin-top:34px;background:var(--dark);color:#C9C4DB;padding:14px 18px;border-radius:var(--r-md);
  font-size:11px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.footer b{color:#fff}
@media (max-width:640px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .chart-row{grid-template-columns:1fr}
  .esc{grid-template-columns:1fr}
  .anuncio{grid-template-columns:1fr}
  .anuncio .foto,.anuncio .sem-foto{width:100%;height:180px}
}

/* ---- alternador pago × não pago: o controle principal desta página ---- */
.alt{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.alt button{font-family:var(--font-display);font-size:13.5px;font-weight:600;
  border:1px solid var(--border);background:#fff;color:var(--gray-text);
  border-radius:var(--r-pill);padding:10px 20px;cursor:pointer;transition:.15s}
.alt button:hover{border-color:var(--mute)}
.alt button.on{color:#fff;border-color:transparent}
.alt button.on[data-lado="pago"]{background:var(--red)}
.alt button.on[data-lado="organico"]{background:var(--green)}
.alt button.on[data-lado="lado"]{background:var(--purple)}
.alt .sep{width:1px;background:var(--border);margin:4px 6px}
.selmarca{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.selmarca button{font-size:12px;padding:8px 15px}
.selmarca button.on{background:var(--dark);border-color:var(--dark);color:#fff}

/* ---- comparação fixa no topo: os dois lados sempre visíveis ---- */
.duelo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.lado{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);
  padding:16px 18px;position:relative;overflow:hidden}
.lado::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.lado.p::before{background:var(--red)}
.lado.o::before{background:var(--green)}
.lado h4{margin:0 0 2px;font-size:12px;letter-spacing:.3px;text-transform:uppercase;color:var(--gray-text)}
.lado .big{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--dark);
  line-height:1.1;font-variant-numeric:tabular-nums}
.lado .linha{display:flex;justify-content:space-between;font-size:12px;margin-top:7px;
  padding-top:7px;border-top:1px solid var(--border)}
.lado .linha:first-of-type{border-top:0}
.lado .linha b{font-variant-numeric:tabular-nums;color:var(--dark)}
@media(max-width:760px){.duelo{grid-template-columns:1fr}}

/* ---- barras sem biblioteca: proporção lida de relance ---- */
.cbars{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);padding:16px 18px;margin-bottom:18px}
.cbar{display:grid;grid-template-columns:150px 1fr 92px;gap:10px;align-items:center;
  font-size:12.5px;padding:5px 0}
.cbar .t{color:var(--text-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbar .g{background:var(--gray-bg);border-radius:var(--r-pill);height:14px;overflow:hidden}
.cbar .g i{display:block;height:100%;border-radius:var(--r-pill)}
.cbar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--dark);font-weight:700}
@media(max-width:640px){.cbar{grid-template-columns:110px 1fr 80px}}
.mudo{opacity:.62}

<script>
/* ============ chaves e fontes ============ */
var H = new URLSearchParams(location.hash.replace(/^#/,''));
var MARCAS = [
  {id:'doctor', nome:'Doctor Mais Saúde', api:'https://myiqdeonxuznvhtsvfxg.supabase.co/functions/v1/relatorio', k:H.get('kd')||''},
  {id:'acesso', nome:'Acesso Saúde Manaus', api:'https://dfvmuqxjdcvwskrrdbfm.supabase.co/functions/v1/relatorio', k:H.get('ka')||''},
];
if (location.hash) history.replaceState(null,'',location.pathname+location.search);

var PAGO = ['Meta Ads','Meta sem id do anúncio','Google Ads'];
var NPAGO = ['Direto / sem origem','Social orgânico','Site e busca'];
var FORA = ['Base importada','Criado pela equipe'];
var COR = {'Meta Ads':'var(--red)','Meta sem id do anúncio':'#F5136E99','Google Ads':'var(--blue)',
           'Direto / sem origem':'var(--green)','Criado pela equipe':'#14B87999',
           'Social orgânico':'var(--purple)','Site e busca':'var(--orange)','Base importada':'var(--mute)'};

var CAN = [], MID = [], JOR = [], MARCAS_OK = [], lado = 'pago', marcaSel = 'todas';
var de = '', ate = '';

/* ============ formatadores, iguais aos do relatório ============ */
var BRL = function(v){return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});};
var BRL0 = function(v){return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});};
var N = function(v){return (v||0).toLocaleString('pt-BR');};
var PCT0 = function(v){return (v||0).toFixed(0).replace('.',',')+'%';};
var PCT1 = function(v){return (v||0).toFixed(1).replace('.',',')+'%';};
var esc = function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var fmtBR = function(s){var p=String(s).split('-');return p[2]+'/'+p[1]+'/'+p[0];};

/* ============ carga ============ */
function carrega(){
  var pend = MARCAS.filter(function(m){return m.k;});
  if(!pend.length){
    document.getElementById('carregando').innerHTML =
      '<b>Nenhuma chave no link.</b> Abra este endereço com as chaves depois do # — ' +
      'canais.html#kd=CHAVE_DOCTOR&amp;ka=CHAVE_ACESSO. As chaves nunca saem do seu navegador.';
    return;
  }
  Promise.all(pend.map(function(m){
    return fetch(m.api+'?k='+encodeURIComponent(m.k)+'&f=dados.json',{cache:'no-cache'})
      .then(function(r){ if(!r.ok) throw new Error(m.nome+': '+r.status); return r.json(); })
      .then(function(d){
        MARCAS_OK.push(m);
        (d.canais||[]).forEach(function(x){ x.m = m.id; CAN.push(x); });
        (d.midia||[]).forEach(function(r){ MID.push({m:m.id, d:r[0], camp:r[1], anuncio:r[2],
          id:String(r[3]), inv:r[4]||0, imp:r[5]||0, cli:r[6]||0, conv:r[7]||0}); });
        (d.jornada||[]).forEach(function(x){ JOR.push({m:m.id, d:x.d, a:String(x.a),
          r:x.r||0, p:x.p||0, v:x.v||0, pg:x.pg||0, ab:x.ab||0, vne:x.vne||0, ne:x.ne||0}); });
      });
  })).then(inicia).catch(function(e){
    document.getElementById('carregando').innerHTML =
      '<b>Não consegui carregar.</b> ' + esc(e.message) +
      '<br>Confira se as chaves do link ainda são válidas.';
  });
}

function inicia(){
  if(!CAN.length){
    document.getElementById('carregando').innerHTML =
      '<b>Os painéis responderam, mas ainda não trazem o bloco de canais.</b> ' +
      'Ele é gerado na publicação diária — tente de novo depois da próxima rodada.';
    return;
  }
  var dias = CAN.map(function(x){return x.d;}).sort();
  ate = dias[dias.length-1]; 
  de = novaData(ate, -29);
  var pri = dias[0];
  if(de < pri) de = pri;
  montaPresets(pri, ate);
  montaAlternador();
  document.getElementById('carregando').style.display='none';
  document.getElementById('conteudo').style.display='';
  render();
}

function novaData(s, delta){
  var p = String(s).split('-'); var d = new Date(Date.UTC(+p[0], +p[1]-1, +p[2]));
  d.setUTCDate(d.getUTCDate()+delta);
  return d.toISOString().slice(0,10);
}

/* ============ período ============ */
function montaPresets(pri, ult){
  var meses = {};
  CAN.forEach(function(x){ meses[x.d.slice(0,7)] = true; });
  var lista = Object.keys(meses).sort().slice(-3);
  var nomes = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto',
               'setembro','outubro','novembro','dezembro'];
  var itens = [
    {r:'7 dias', de:novaData(ult,-6), ate:ult},
    {r:'30 dias', de:novaData(ult,-29), ate:ult},
  ];
  lista.forEach(function(ym){
    var a = +ym.slice(0,4), m = +ym.slice(5,7);
    var fim = new Date(Date.UTC(a, m, 0)).toISOString().slice(0,10);
    itens.push({r:nomes[m-1].charAt(0).toUpperCase()+nomes[m-1].slice(1), de:ym+'-01', ate:fim});
  });
  itens.push({r:'Tudo', de:pri, ate:ult});
  var el = document.getElementById('presets');
  el.innerHTML = itens.map(function(i,n){
    return '<button class="preset" data-de="'+i.de+'" data-ate="'+i.ate+'">'+i.r+'</button>';

      document.getElementById('editor').classList.remove('aberto'); render(); }

}

/* ============ agregação ============ */
/* 'ch' (conversas abertas) e somavel e entra aqui. 'pes' (contatos distintos com
   conversa no dia) NAO entra: somar distinto de varios dias da pessoa-dia, nao
   pessoa, e publicar isso como "pessoas" seria inventar um numero. */
function zero(){return {ch:0,ct:0,ctp:0,k:0,p:0,o:0,e:0,ne:0,vne:0,vprop:0,v:0,pg:0,ab:0,nf:0,pf:0,qa:0,qat:0};}
function soma(a,x){
  ['ch','ct','ctp','k','p','o','e','ne','vne','vprop','v','pg','ab','nf','pf','qa','qat']
    .forEach(function(c){ a[c] += x[c]||0; });
  return a;
}
function noPeriodo(x){
  return x.d >= de && x.d <= ate && (marcaSel==='todas' || x.m===marcaSel);
}
function porCanal(){
  var m = {};
  CAN.filter(noPeriodo).forEach(function(x){
    if(!m[x.c]) m[x.c] = soma(zero(), {});
    soma(m[x.c], x);
  });
  return m;
}
function totalDe(canais, mapa){
  return canais.reduce(function(a,c){ return mapa[c] ? soma(a, mapa[c]) : a; }, zero());
}
function investimento(){
  return MID.filter(function(r){
    return r.d >= de && r.d <= ate && (marcaSel==='todas' || r.m===marcaSel);
  }).reduce(function(a,r){ return a + (r.inv||0); }, 0);
}


/* ============ midia paga em detalhe ============
   A mesma leitura da aba "Midia paga" do dossie, agora para as duas marcas de uma vez.
   A especialidade sai do nome da campanha, e a regra tem uma armadilha: a agencia
   nomeia as duas contas em ordem OPOSTA --
     Doctor  [VG] [ESPECIALIDADE] [FORMATO]
     Acesso  [VG] [FORMATO] [ESPECIALIDADE]
   Por isso nao da para pegar "o segundo colchete": descarta-se o que e agencia,
   formato, publico, data ou valor, e o primeiro pedaco que sobra e a especialidade. */
var IGNORA = {};
["VG","ABO","ON","APH","MSG","MSG-WHATSAPP","ENG-WHATSAPP","ENGAJAMENTO-WHATSAPP",
 "ENGAJAMENTO","TRAFEGO","TR\u00c1FEGO","WHATS","WPP","WHATSAPP","VIDEO","V\u00cdDEO","CARD",
 "TOPO","CONVERSAS","ALL","F+Q","SEGUIDORES","45+","REMARKETING"]
 .forEach(function(x){ IGNORA[x] = 1; });
var APELIDO = {RMKT:"Remarketing", SANGUE:"Coleta de sangue", HIPERBARICA:"Hiperb\u00e1rica",
  ENDOCRINO:"End\u00f3crino", TOXICOLOGICO:"Toxicol\u00f3gico",
  OFTALMO:"Oftalmologista", PROCEDIMENTOS:"Procedimentos"};
function semAcento(x){ return x.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
function ehLixo(t){
  return !t || IGNORA[t] || IGNORA[semAcento(t)]
      || /^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(t) || /^\$?\s*[\d.,]+$/.test(t);
}
function curto(nome){
  var cru = String(nome || "").trim();
  if (/^publica[c\u00e7][a\u00e3]o do instagram/i.test(cru)) return "Publica\u00e7\u00e3o impulsionada";
  var col = (cru.match(/\[([^\]]*)\]/g) || []).map(function(x){ return x.slice(1, -1).trim(); });
  var ped = col.length ? col : cru.split("|").map(function(x){ return x.trim(); });
  var util = null;
  ped.map(function(t){ return t.replace(/\s*\(\d+\)\s*$/, "").replace(/\s+\d{1,2}$/, "").trim(); })
     .forEach(function(t){ if (util === null && !ehLixo(t.toUpperCase())) util = t; });
  if (!util) return "Sem classifica\u00e7\u00e3o";
  var k = util.toUpperCase();
  return APELIDO[k] || (util.charAt(0).toUpperCase() + util.slice(1).toLowerCase());
}

function midiaNoPeriodo(){
  return MID.filter(function(r){
    return r.d >= de && r.d <= ate && (marcaSel === "todas" || r.m === marcaSel);
  });
}

function cartao(c){
  return "<div class=\"kpi-card\"><div class=\"kpi-val\">" + c[0] + "</div>" +
         "<div class=\"kpi-label\">" + c[1] + "</div>" +
         "<div class=\"kpi-sub\">" + c[2] + "</div></div>";
}

function pintaMidia(){
  var mid = midiaNoPeriodo();
  var t = {inv:0, imp:0, cli:0, conv:0}, dias = {}, espec = {}, adEsp = {}, adsPer = {};
  mid.forEach(function(r){
    t.inv += r.inv; t.imp += r.imp; t.cli += r.cli; t.conv += r.conv;
    dias[r.d] = 1; adsPer[r.id] = 1;
    var e = curto(r.camp); adEsp[r.id] = e;
    var o = espec[e] || (espec[e] = {inv:0, conv:0, dias:{}, v:0, pg:0, ab:0, vne:0, ne:0});
    o.inv += r.inv; o.conv += r.conv; o.dias[r.d] = 1;
  });

  /* Mesma regra do dossie: contato de anuncio que nao veiculou no periodo nao entra
     no total -- ele nao tem investimento aqui. Fica declarado como "fora". */
  var cr = {r:0, p:0, v:0, pg:0, ab:0, vne:0, ne:0}, fora = {r:0, p:0, v:0};
  JOR.filter(function(x){
    return x.d >= de && x.d <= ate && (marcaSel === "todas" || x.m === marcaSel);
  }).forEach(function(x){
    if (!adsPer[x.a]) { fora.r += x.r; fora.p += x.p; fora.v += x.v; return; }
    cr.r += x.r; cr.p += x.p; cr.v += x.v; cr.pg += x.pg; cr.ab += x.ab;
    cr.vne += x.vne; cr.ne += x.ne;
    var o = espec[adEsp[x.a]];
    if (o) { o.v += x.v; o.pg += x.pg; o.ab += x.ab; o.vne += x.vne; o.ne += x.ne; }
  });

  var nDias = Object.keys(dias).length;
  var cob = t.conv ? 100 * cr.r / t.conv : 0;

  document.getElementById("midiaAviso").innerHTML =
    "<div class=\"nota\"><b>" + PCT0(cob) + " de cobertura de rastreio.</b> " +
    N(cr.r) + " das " + N(t.conv) + " conversas do per\u00edodo chegaram ao CRM trazendo o ID do an\u00fancio. " +
    "Abaixo de 50% o funil por campanha vira estimativa e n\u00e3o deve ser usado para decidir verba." +
    (fora.r ? " <b>Fora do total:</b> " + N(fora.r) + " contatos de an\u00fancio que n\u00e3o veiculou no per\u00edodo " +
      "-- resultado conhecido, custo desconhecido, ent\u00e3o n\u00e3o entram no retorno." : "") + "</div>";

  document.getElementById("midiaKpis").innerHTML = [
    [BRL(t.inv), "Investimento Meta Ads", nDias + " dias com veicula\u00e7\u00e3o"],
    [N(t.imp), "Impress\u00f5es", t.imp ? BRL(1000 * t.inv / t.imp) + " de CPM" : "\u2014"],
    [N(t.cli), "Cliques", t.imp ? ((100*t.cli/t.imp).toFixed(2).replace(".",",")+"%") + " de CTR" : "\u2014"],
    [t.cli ? BRL(t.inv / t.cli) : "\u2014", "CPC", "custo por clique"],
    [N(t.conv), "Conversas iniciadas", t.conv ? BRL(t.inv / t.conv) + " por conversa \u00b7 a Meta contou" : "\u2014"],
    [N(cr.r), "Leads no CRM", cr.r ? BRL(t.inv / cr.r) + " por lead \u00b7 " + PCT0(cob) + " das conversas" : "\u2014"],
    [N(cr.p), "Viraram paciente", cr.p ? BRL(t.inv / cr.p) + " por paciente \u00b7 " + (cr.r ? PCT0(100 * cr.p / cr.r) : "\u2014") + " dos leads" : "\u2014"],
    [nDias ? BRL(t.inv / nDias) : "\u2014", "M\u00e9dia por dia", "investimento di\u00e1rio no per\u00edodo"]
  ].map(cartao).join("");

  document.getElementById("midiaRetorno").innerHTML = [
    [BRL0(cr.v), "Faturado", "o que a m\u00eddia devolveu, vindo do Feegow"],
    [BRL0(cr.pg), "Recebido", cr.v ? PCT0(100 * cr.pg / cr.v) + " do faturado" : "\u2014"],
    [BRL0(cr.ab), "Em aberto", cr.v ? PCT0(100 * cr.ab / cr.v) + " do faturado" : "\u2014"],
    [BRL0(cr.vne), "N\u00e3o executado", N(cr.ne) + " propostas paradas na mesa"],
    [t.inv ? (cr.v / t.inv).toFixed(1).replace(".", ",") + "\u00d7" : "\u2014", "Retorno sobre a m\u00eddia",
      t.inv ? BRL(cr.v / t.inv) + " faturados por R$ 1 investido" : "sem investimento no per\u00edodo"],
    [t.inv ? (cr.pg / t.inv).toFixed(1).replace(".", ",") + "\u00d7" : "\u2014", "Retorno j\u00e1 em caixa",
      "s\u00f3 o que entrou, sem contar o em aberto"],
    [cr.p ? BRL(t.inv / cr.p) : "\u2014", "Custo por paciente", N(cr.p) + " pacientes atribu\u00eddos"],
    [cr.p ? BRL0(cr.v / cr.p) : "\u2014", "Faturado por paciente", "m\u00e9dia, inclusive quem n\u00e3o comprou"]
  ].map(cartao).join("");

  var linhas = Object.keys(espec).map(function(e){ return {e:e, o:espec[e]}; })
                     .sort(function(a, b){ return b.o.inv - a.o.inv; });
  var td = function(v){ return "<td class=\"num\">" + v + "</td>"; };
  document.getElementById("tEspec").innerHTML =
    "<thead><tr class=\"faixa\"><th colspan=\"5\"></th>" +
      "<th colspan=\"3\" class=\"fx fx-prop\">Servi\u00e7o prestado, e o que ficou na mesa</th>" +
      "<th colspan=\"2\" class=\"fx fx-fat\">A mesma fatura, quitada ou n\u00e3o</th></tr>" +
    "<tr><th>Especialidade</th><th class=\"num\">Dias no ar</th><th class=\"num\">Investimento</th>" +
      "<th class=\"num\">Conversas</th><th class=\"num\">Custo/conversa</th>" +
      "<th class=\"num\">Faturado</th><th class=\"num\">N\u00e3o executado</th>" +
      "<th class=\"num\">Propostas paradas</th>" +
      "<th class=\"num\">Recebido</th><th class=\"num\">Em aberto</th></tr></thead><tbody>" +
    linhas.map(function(x){
      var o = x.o;
      return "<tr><td>" + esc(x.e) + "</td>" + td(N(Object.keys(o.dias).length)) + td(BRL(o.inv)) +
        td(N(o.conv)) + td(o.conv ? BRL(o.inv / o.conv) : "\u2014") +
        td(o.v ? BRL0(o.v) : "\u2014") + td(o.vne ? BRL0(o.vne) : "\u2014") +
        td(o.ne ? N(o.ne) : "\u2014") +
        td(o.pg ? BRL0(o.pg) : "\u2014") + td(o.ab ? BRL0(o.ab) : "\u2014") + "</tr>";
    }).join("") + "</tbody>" +
    "<tfoot><tr><td>Total \u2014 " + N(linhas.length) + " especialidades</td>" +
      td(N(nDias)) + td(BRL(t.inv)) + td(N(t.conv)) + td(t.conv ? BRL(t.inv / t.conv) : "\u2014") +
      td(BRL0(cr.v)) + td(BRL0(cr.vne)) + td(N(cr.ne)) + td(BRL0(cr.pg)) + td(BRL0(cr.ab)) +
      "</tr></tfoot>";

  document.getElementById("notaEspec").innerHTML = "<div class=\"nota\">" +
    "<b>O investimento \u00e9 s\u00f3 o da Meta.</b> Google Ads aparece como canal l\u00e1 em cima porque o " +
    "contato traz o utm, mas a conta de m\u00eddia do Google n\u00e3o \u00e9 coletada \u2014 o retorno acima est\u00e1 " +
    "medido contra um investimento que exclui o que foi gasto l\u00e1. " +
    "<b>A especialidade sai do nome da campanha</b>, e a mesma ag\u00eancia nomeia as duas contas em ordem " +
    "oposta; a regra descarta ag\u00eancia, formato, p\u00fablico e data, e fica com o primeiro peda\u00e7o que sobra. " +
    "Campanha sem taxonomia cai em \"Sem classifica\u00e7\u00e3o\" em vez de ser distribu\u00edda no chute. " +
    "<b>Cada paciente pertence a um an\u00fancio s\u00f3</b> \u2014 o primeiro que o trouxe \u2014 e s\u00f3 entra o que " +
    "aconteceu depois disso, igual \u00e0 tabela de canais acima.</div>";
}

/* ============ desenho ============ */
function render(){
  document.getElementById('rotuloData').textContent = fmtBR(de) + ' — ' + fmtBR(ate);
  var mapa = porCanal();
  var tp = totalDe(PAGO, mapa), tn = totalDe(NPAGO, mapa);
  var inv = investimento();
  pintaDuelo(tp, tn, inv);
  var alvo = lado === 'pago' ? tp : (lado === 'organico' ? tn : soma(soma(zero(), tp), tn));
  var canais = lado === 'pago' ? PAGO : (lado === 'organico' ? NPAGO : PAGO.concat(NPAGO));
  pintaKpis(alvo, inv);
  pintaBarras(mapa, canais);
  pintaTabela(mapa, canais, alvo, inv);
  pintaFora(mapa);
  pintaAusencias();
  pintaMidia();
}

    [t.ct ? (t.ch/t.ct).toFixed(2).replace('.',',') : '—', 'Conversas por contato novo',

    [N(t.p), 'Viraram paciente', t.ch ? PCT1(100*t.p/t.ch)+' das chegadas' : '—'],
    [BRL0(t.v), 'Faturado', N(t.nf)+' faturas de '+N(t.pf)+' pacientes'],
    [BRL0(t.pg), 'Recebido', t.v ? PCT0(100*t.pg/t.v)+' do faturado' : '—'],
    [BRL0(t.ab), 'Em aberto', t.v ? PCT0(100*t.ab/t.v)+' do faturado' : '—'],

    [t.p ? BRL0(t.v/t.p) : '—', 'Faturado por paciente', 'média, inclusive quem não comprou'],

      ? [inv ? (t.v/inv).toFixed(1).replace('.',',')+'×' : '—', 'Retorno sobre a mídia',
         inv ? BRL0(inv)+' investidos no período' : 'sem investimento no período']

  document.getElementById('kpis').innerHTML = cartoes.map(function(c){
    return '<div class="kpi-card"><div class="kpi-val">'+c[0]+'</div>' +
           '<div class="kpi-label">'+c[1]+'</div><div class="kpi-sub">'+c[2]+'</div></div>';
  }).join('');
  /* A confusao mais cara desta tela e achar que chegada e contato novo. Sao denominadores
     diferentes para a MESMA receita, e a taxa muda de nome junto. */
  var notaUnidade = '<div class="nota"><b>Chegada e contato novo não são a mesma coisa.</b> ' +
    'Chegada é toda conversa aberta no período — inclusive de quem já era da base e voltou. ' +
    'Contato novo é registro criado pela primeira vez. O dinheiro abaixo é o mesmo nos dois casos: ' +

    'O que muda é o denominador, e por isso a conversão sobre chegadas é sempre menor que a ' +

      'O que existe é custo de operação — atendente, tempo de resposta, o CRM — que não passa por este painel. ' +
      'Trate este faturamento como o piso da casa: é o que entra mesmo sem verba. ' +
      '<br><br><b>Boa parte disto é retorno, não conquista.</b> Paciente que já conhece a clínica e chama ' +
      'de novo pelo WhatsApp cai em "Direto / sem origem" igual a quem nunca veio. O painel sabe que a ' +
      'pessoa chegou sozinha; não sabe se foi a primeira vez.</div>',
    lado: '<div class="nota"><b>Aqui não aparece retorno sobre mídia, de propósito.</b> Dividir o faturamento ' +
      'somado pela verba da Meta daria um número enorme e falso: a maior parte deste dinheiro veio de quem ' +
      'não passou por anúncio nenhum. Retorno sobre mídia só faz sentido no lado pago.</div>'
  };

}

function pintaBarras(mapa, canais){
  var linhas = canais.map(function(c){ return {c:c, t:mapa[c]||zero()}; })
                     .filter(function(x){ return x.t.ch || x.t.ct || x.t.v; })
                     .sort(function(a,b){ return b.t.v - a.t.v || b.t.ct - a.t.ct; });
  var maxV = Math.max.apply(null, linhas.map(function(x){return x.t.v;}).concat([1]));
  var maxC = Math.max.apply(null, linhas.map(function(x){return x.t.ch;}).concat([1]));
  var bloco = function(titulo, chave, max, fmt){
    return '<div style="font-family:var(--font-display);font-size:12.5px;font-weight:700;' +
           'color:var(--dark);margin:2px 0 8px">'+titulo+'</div>' +
           linhas.map(function(x){
             var v = x.t[chave];
             return '<div class="cbar"><div class="t" title="'+esc(x.c)+'">'+esc(x.c)+'</div>' +
               '<div class="g"><i style="width:'+(100*v/max).toFixed(1)+'%;background:'+COR[x.c]+'"></i></div>' +
               '<div class="v">'+fmt(v)+'</div></div>';
           }).join('');
  };
  document.getElementById('barras').innerHTML =
    bloco('Faturado por canal', 'v', maxV, BRL0) +
    '<div style="height:14px"></div>' +
    bloco('Chegadas por canal', 'ch', maxC, N);
}

function pintaTabela(mapa, canais, tot, inv){
  var linhas = canais.map(function(c){ return {c:c, t:mapa[c]||zero()}; })
                     .filter(function(x){ return x.t.ch || x.t.ct || x.t.v; })
                     .sort(function(a,b){ return b.t.v - a.t.v || b.t.ct - a.t.ct; });
  var td = function(v){ return '<td class="num">'+v+'</td>'; };
  document.getElementById('tCanais').innerHTML =
    '<thead><tr class="faixa"><th colspan="4"></th>' +
      '<th colspan="2" class="fx fx-prop">Serviço prestado, e o que ficou na mesa</th>' +
      '<th colspan="2" class="fx fx-fat">A mesma fatura, quitada ou não</th></tr>' +
    '<tr><th>Canal</th><th class="num">Chegadas</th><th class="num">Contatos novos</th>' +
      '<th class="num">Pacientes</th>' +
      '<th class="num">Conversão</th><th class="num">Faturado</th><th class="num">Não executado</th>' +
      '<th class="num">Recebido</th><th class="num">Em aberto</th></tr></thead>' +
    '<tbody>' + linhas.map(function(x){
      var t = x.t;
      return '<tr><td>'+esc(x.c)+'</td>' + td(N(t.ch)) + td(N(t.ct)) + td(N(t.p)) +
        td(t.ch ? PCT1(100*t.p/t.ch) : '—') +
        td(t.v ? BRL0(t.v) : '—') + td(t.vne ? BRL0(t.vne) : '—') +
        td(t.pg ? BRL0(t.pg) : '—') + td(t.ab ? BRL0(t.ab) : '—') + '</tr>';
    }).join('') + '</tbody>' +
    '<tfoot><tr><td>Total</td>' + td(N(tot.ch)) + td(N(tot.ct)) + td(N(tot.p)) +
      td(tot.ch ? PCT1(100*tot.p/tot.ch) : '—') + td(BRL0(tot.v)) + td(BRL0(tot.vne)) +
      td(BRL0(tot.pg)) + td(BRL0(tot.ab)) + '</tr></tfoot>';
  document.getElementById('notaTabela').innerHTML = '<div class="nota">' +
    '<b>Cada paciente aparece em um canal só.</b> Ele pertence ao primeiro contato que teve no CRM, e ' +
    'só entra o que aconteceu depois disso. Sem essas duas regras o mesmo dinheiro apareceria nos dois ' +
    'lados do alternador e a soma passaria do faturamento real da clínica. ' +
    '<b>Faturado = Recebido + Em aberto</b>, sempre, aqui como no relatório de campanha — sai das mesmas faturas. ' +
    '<br><br><b>"Direto / sem origem" não é sinônimo de orgânico puro.</b> É quem chegou no WhatsApp sem ' +
    'nenhuma marca de campanha: pode ter vindo de um post, de indicação, da fachada ou de já conhecer a ' +
    'clínica. O CRM registra a chegada, não o motivo. ' +
    '<b>"Meta sem id do anúncio"</b> é clique em anúncio cujo identificador não veio — é pago, e por isso ' +
    'está do lado pago, mas não dá para dizer de qual campanha.</div>';
}

function pintaFora(mapa){
  var bi = mapa['Base importada'] || zero(), eq = mapa['Criado pela equipe'] || zero();
  var resumo = function(t){
    return N(t.ch) + ' chegadas · ' + N(t.ct) + ' contatos novos · ' + N(t.p) + ' pacientes · ' + BRL0(t.v) + ' faturados · ' +
           BRL0(t.pg) + ' recebidos';
  };
  document.getElementById('fora').innerHTML = '<div class="nota mudo">' +
    '<b>Dois grupos ficam fora do alternador de propósito, porque não são porta de entrada.</b>' +
    '<br><br><b>Base importada</b> — ' + resumo(bi) + '.<br>' +
    'Cadastros que entraram no CRM por importação em massa, não por alguém ter chamado a clínica. ' +
    'A data de criação é a do import, não a da chegada — contar isso como canal creditaria a marketing ' +
    'a base inteira que a clínica já tinha antes de existir rastreio.' +
    '<br><br><b>Criado pela equipe</b> — ' + resumo(eq) + '.<br>' +
    'Contato aberto pela recepção. Uma parte é gente que ligou ou apareceu na porta, o que seria não pago ' +
    'de verdade; outra parte é paciente antigo sendo cadastrado na hora do atendimento. ' +
    (eq.ct ? 'A taxa de virar paciente aqui é de ' + PCT1(100*eq.p/eq.ct) + ', contra ' : '') +
    'muito menos em qualquer canal de aquisição — e essa distância é justamente o sinal de que a maioria ' +
    'já era paciente antes. Enquanto a recepção não separar os dois casos, somar isto ao orgânico ' +
    'inflaria o não pago sem que ninguém conseguisse defender o número.</div>';
}

    '<br><br><b>O que daria para ligar, se valer a pena:</b> a API de Insights da página entrega alcance, ' +
    'impressões e engajamento por publicação, e o mesmo token da Meta que já usamos para os anúncios ' +
    'costuma servir. Com isso o lado orgânico ganharia o topo do funil que hoje só o pago tem. ' +
    '<br><br><b>Custo de mídia do Google também não é coletado</b> — só o contato com utm de CPC. ' +
    'E não há dado de SEO: posição, clique de busca, página de entrada.</div>';
}
